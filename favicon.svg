<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0e1a"/>
  
  <!-- Globe body -->
  <circle cx="32" cy="32" r="22" fill="#0d2d5c" stroke="#3b82f6" stroke-width="1.5"/>
  
  <!-- Latitude lines -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Longitude lines -->
  <ellipse cx="32" cy="32" rx="10" ry="22" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Atmosphere glow -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.25"/>
  
  <!-- Letter A -->
  <text x="32" y="38" font-family="Arial Black, sans-serif" font-size="18" font-weight="900"
        text-anchor="middle" fill="white" opacity="0.95">A</text>
</svg>
