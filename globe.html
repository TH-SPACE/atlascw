<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — Globo 3D</title>
    <meta name="robots" content="index, follow" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6881716879173835"
        crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }

        .logo {
            font-size: clamp(4.5rem, 13vw, 10rem);
            font-weight: 900;
            letter-spacing: -6px;
            color: transparent;
            background: linear-gradient(135deg, #ffffff 0%, #a0c4ff 50%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            line-height: 1;
            text-transform: uppercase;
            filter: drop-shadow(0 0 40px rgba(80, 140, 255, 0.8)) drop-shadow(0 0 100px rgba(40, 80, 255, 0.4));
            animation: logoIn 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes logoIn {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 100px;
            text-decoration: none;
            z-index: 20;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #trail {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
            pointer-events: none;
            z-index: 8;
        }

        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.025) 2px, rgba(0, 0, 0, 0.025) 4px);
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>

<body>

    <canvas id="c"></canvas>
    <canvas id="trail"></canvas>
    <div class="vignette"></div>
    <div class="scanline"></div>
    <a href="index.html" class="back-btn">← Voltar</a>

    <div class="ui">
        <div class="logo">Atlas</div>
    </div>

    <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }
  </script>

    <script type="module">
        import * as THREE from 'three';

        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000510, 0.04);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 200);
        camera.position.set(0, 0, 3.6);

        /* SHADERS */
        const atmoVS = `varying vec3 vNormal; varying vec3 vViewDir;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      vViewDir = normalize(-mvPos.xyz);
      gl_Position = projectionMatrix * mvPos;
    }`;
        const atmoFS = `uniform vec3 glowColor; uniform float coeff; uniform float power;
    varying vec3 vNormal; varying vec3 vViewDir;
    void main() {
      float intensity = pow(coeff - dot(vNormal, vViewDir), power);
      gl_FragColor = vec4(glowColor, intensity);
    }`;

        const atmoMat = new THREE.ShaderMaterial({
            uniforms: { glowColor: { value: new THREE.Color(0x2266ff) }, coeff: { value: 0.8 }, power: { value: 3.5 } },
            vertexShader: atmoVS, fragmentShader: atmoFS,
            side: THREE.FrontSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
        });
        const haloMat = new THREE.ShaderMaterial({
            uniforms: { glowColor: { value: new THREE.Color(0x0033cc) }, coeff: { value: 0.6 }, power: { value: 2.5 } },
            vertexShader: atmoVS, fragmentShader: atmoFS,
            side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
        });

        /* GLOBE */
        const R = 1.0;
        const geoGlobe = new THREE.SphereGeometry(R, 128, 128);
        const pos = geoGlobe.attributes.position;
        const colArr = new Float32Array(pos.count * 3);
        const cLand = new THREE.Color(0x0d2d5c);
        const cOcean = new THREE.Color(0x040e1e);
        const cPolar = new THREE.Color(0x4488cc);
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            const n = Math.sin(x * 5.2 + 1.3) * Math.cos(y * 4.1 + 0.9) * Math.sin(z * 6.3 + 2.0)
                + Math.sin(x * 9.1 + y * 7.0) * 0.35 + Math.cos(z * 8.5 + x * 3.2) * 0.2;
            const c = Math.abs(y) > 0.88 ? cPolar : n > 0.15 ? cLand : cOcean;
            colArr[i * 3] = c.r; colArr[i * 3 + 1] = c.g; colArr[i * 3 + 2] = c.b;
        }
        geoGlobe.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
        const matGlobe = new THREE.MeshPhongMaterial({ vertexColors: true, specular: new THREE.Color(0x2244aa), shininess: 60 });
        const globe = new THREE.Mesh(geoGlobe, matGlobe);
        scene.add(globe);
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(R * 1.07, 64, 64), atmoMat));
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(R * 1.22, 64, 64), haloMat));

        /* GRID */
        const lineMat = new THREE.LineBasicMaterial({ color: 0x1a44aa, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false });
        for (let i = 1; i < 10; i++) {
            const phi = (i / 10) * Math.PI, r = Math.sin(phi) * (R + 0.002), yy = Math.cos(phi) * (R + 0.002);
            const pts = [];
            for (let j = 0; j <= 128; j++) { const a = (j / 128) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * r, yy, Math.sin(a) * r)); }
            globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
        }
        for (let i = 0; i < 16; i++) {
            const theta = (i / 16) * Math.PI * 2, pts = [];
            for (let j = 0; j <= 128; j++) { const phi = (j / 128) * Math.PI; pts.push(new THREE.Vector3(Math.sin(phi) * Math.cos(theta) * (R + 0.002), Math.cos(phi) * (R + 0.002), Math.sin(phi) * Math.sin(theta) * (R + 0.002))); }
            globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
        }

        /* SURFACE DOTS */
        const dotPos = [];
        for (let i = 0; i < 3000; i++) { const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2, r = R + 0.004; dotPos.push(Math.sin(phi) * Math.cos(theta) * r, Math.cos(phi) * r, Math.sin(phi) * Math.sin(theta) * r); }
        const dotGeo = new THREE.BufferGeometry();
        dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPos, 3));
        globe.add(new THREE.Points(dotGeo, new THREE.PointsMaterial({ color: 0x4499ff, size: 0.007, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false })));

        /* ARCS */
        function rndSurf() { const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2; return new THREE.Vector3(Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta)); }
        function makeArc(a, b, seg = 60) { const pts = []; for (let i = 0; i <= seg; i++) { const t = i / seg, v = new THREE.Vector3().lerpVectors(a, b, t).normalize(); pts.push(v.multiplyScalar(1 + Math.sin(t * Math.PI) * 0.28)); } return pts; }
        const arcLineMat = new THREE.LineBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
        const arcs = [];
        for (let i = 0; i < 18; i++) { const a = rndSurf(), b = rndSurf(), mat = arcLineMat.clone(), line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(makeArc(a, b)), mat); globe.add(line); arcs.push({ line, mat, progress: 0, speed: 0.004 + Math.random() * 0.006, delay: Math.random() * 4 }); }

        /* RINGS */
        function makeRing(r, tilt, color, op) { const pts = []; for (let i = 0; i <= 256; i++) { const a = (i / 256) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r)); } const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false })); ring.rotation.x = tilt; scene.add(ring); return ring; }
        const ring1 = makeRing(1.55, Math.PI / 3, 0x2255ff, 0.35);
        const ring2 = makeRing(1.85, Math.PI / 6, 0x1133cc, 0.20);
        const ring3 = makeRing(2.10, Math.PI / 2.2, 0x0022aa, 0.15);

        /* ORBITERS */
        function makeOrbiter(r, tilt, color) { const geo = new THREE.SphereGeometry(0.018, 8, 8), mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 }), mesh = new THREE.Mesh(geo, mat), light = new THREE.PointLight(color, 1.5, 0.6); mesh.add(light); scene.add(mesh); return { mesh, orbitRadius: r, tilt, angle: Math.random() * Math.PI * 2, speed: 0.006 + Math.random() * 0.004 }; }
        const orbiters = [makeOrbiter(1.55, Math.PI / 3, 0x55aaff), makeOrbiter(1.55, Math.PI / 3, 0xaaddff), makeOrbiter(1.85, Math.PI / 6, 0x3366ff), makeOrbiter(2.10, Math.PI / 2.2, 0x2244cc)];

        /* STARS */
        const sPos = []; for (let i = 0; i < 5000; i++) { const r = 30 + Math.random() * 70, phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2; sPos.push(Math.sin(phi) * Math.cos(theta) * r, Math.cos(phi) * r, Math.sin(phi) * Math.sin(theta) * r); }
        const sGeo = new THREE.BufferGeometry(); sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
        scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.06, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false })));

        /* NEBULA */
        function nebula(x, y, z, color, size) { const m = new THREE.Mesh(new THREE.SphereGeometry(size, 8, 8), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.04, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide })); m.position.set(x, y, z); scene.add(m); }
        nebula(-8, 4, -15, 0x1122ff, 10); nebula(10, -3, -20, 0x002288, 14); nebula(2, 8, -18, 0x0011aa, 8);

        /* LIGHTS */
        const sunLight = new THREE.DirectionalLight(0x6699ff, 4); sunLight.position.set(-5, 3, 4); scene.add(sunLight);
        scene.add(new THREE.DirectionalLight(0x112244, 1.2).position.set(5, -2, -3) || new THREE.DirectionalLight(0x112244, 1.2));
        const fillL = new THREE.DirectionalLight(0x112244, 1.2); fillL.position.set(5, -2, -3); scene.add(fillL);
        const rimL = new THREE.DirectionalLight(0x3355ff, 2.5); rimL.position.set(3, 0, -5); scene.add(rimL);
        scene.add(new THREE.AmbientLight(0x080818, 2));

        /* MOUSE TRAIL */
        const trailCanvas = document.getElementById('trail');
        const ctx = trailCanvas.getContext('2d');
        trailCanvas.width = window.innerWidth; trailCanvas.height = window.innerHeight;
        const trail = []; let mx = window.innerWidth / 2, my = window.innerHeight / 2, tx = 0, ty = 0;
        const bursts = [];
        window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; tx = (e.clientX / window.innerWidth - 0.5) * 2; ty = (e.clientY / window.innerHeight - 0.5) * 2; trail.push({ x: mx, y: my }); if (trail.length > 80) trail.shift(); });
        window.addEventListener('click', e => { bursts.push({ x: e.clientX, y: e.clientY, r: 0, alpha: 1 }); });

        function drawTrail() {
            ctx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
            for (let i = 1; i < trail.length; i++) { const t = i / trail.length, p = trail[i - 1], c = trail[i]; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(c.x, c.y); ctx.strokeStyle = `rgba(80,160,255,${t * 0.6})`; ctx.lineWidth = t * 2.5; ctx.lineCap = 'round'; ctx.stroke(); }
            if (trail.length > 0) { const l = trail[trail.length - 1], g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, 28); g.addColorStop(0, 'rgba(100,180,255,0.5)'); g.addColorStop(1, 'rgba(100,180,255,0)'); ctx.beginPath(); ctx.arc(l.x, l.y, 28, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill(); }
            for (let i = bursts.length - 1; i >= 0; i--) { const b = bursts[i]; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.strokeStyle = `rgba(100,180,255,${b.alpha})`; ctx.lineWidth = 2; ctx.stroke(); b.r += 4; b.alpha -= 0.04; if (b.alpha <= 0) bursts.splice(i, 1); }
        }

        /* RESIZE */
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); trailCanvas.width = window.innerWidth; trailCanvas.height = window.innerHeight; });

        /* ANIMATE */
        const clock = new THREE.Clock(); let rotX = 0, rotY = 0;
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            rotX += (-ty * 0.22 - rotX) * 0.05; rotY += (tx * 0.22 - rotY) * 0.05;
            globe.rotation.y += 0.0018; globe.rotation.x = rotX;
            ring1.rotation.z = t * 0.08; ring2.rotation.z = -t * 0.05; ring3.rotation.z = t * 0.04;
            for (const o of orbiters) { o.angle += o.speed; const x = Math.cos(o.angle) * o.orbitRadius, z = Math.sin(o.angle) * o.orbitRadius, yy = Math.sin(o.angle * 0.5) * o.orbitRadius * Math.sin(o.tilt); o.mesh.position.set(x, yy, z); }
            for (const a of arcs) { if (t < a.delay) continue; a.progress = Math.min(1, a.progress + a.speed); a.mat.opacity = a.progress < 0.5 ? a.progress * 0.9 : (1 - a.progress) * 0.9; if (a.progress >= 1) { const p1 = rndSurf(), p2 = rndSurf(); a.line.geometry.setFromPoints(makeArc(p1, p2)); a.progress = 0; a.delay = t + Math.random() * 2; } }
            atmoMat.uniforms.coeff.value = 0.78 + Math.sin(t * 1.3) * 0.04;
            sunLight.position.x = Math.cos(t * 0.08) * 5; sunLight.position.z = Math.sin(t * 0.08) * 4;
            drawTrail();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
