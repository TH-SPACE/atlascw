<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — Clima do Mundo</title>
    <meta name="description"
        content="Previsão do tempo animada em tempo real para qualquer cidade do mundo. Visual cinematográfico com modo TV." />
    <meta name="keywords" content="previsão do tempo, clima hoje, temperatura, chuva, vento, atlas weather" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://atlascw.com.br/" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6881716879173835"
        crossorigin="anonymous"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --transition: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* ── CANVAS BG ── */
        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
        }

        /* ── PARTICLES ── */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        /* ── OVERLAY VIGNETTE ── */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0, 0, 0, 0.55) 100%);
            pointer-events: none;
        }

        /* ── MAIN LAYOUT ── */
        .app {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        /* ── TOP NAV ── */
        .topnav {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 28px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent);
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .nav-sep {
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.2rem;
        }

        .search-wrap {
            flex: 1;
            max-width: 420px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 100px;
            color: #fff;
            font-size: 0.875rem;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(10px);
            transition: background 0.2s, border-color 0.2s;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .search-ico {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            overflow: hidden;
            display: none;
            z-index: 100;
        }

        .suggestions.open {
            display: block;
        }

        .sug-item {
            padding: 11px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sug-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .sug-sub {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .nav-right {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
            text-decoration: none;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ── MAIN CONTENT ── */
        .main-content {
            flex: 1;
            display: flex;
            padding: 0 28px 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* ── LEFT: BIG WEATHER ── */
        .weather-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 10px;
        }

        .location-line {
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: slideUp 0.6s ease forwards;
        }

        .city-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            color: #fff;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.7s ease forwards;
        }

        .country-name {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            margin-bottom: 20px;
            animation: slideUp 0.8s ease forwards;
        }

        .temp-row {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 8px;
            animation: slideUp 0.9s ease forwards;
        }

        .temp-big {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4rem, 12vw, 9rem);
            line-height: 0.85;
            color: #fff;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.15);
        }

        .temp-unit {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.5);
            align-self: flex-start;
            margin-top: 12px;
        }

        .weather-icon-big {
            font-size: clamp(3rem, 8vw, 6rem);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
            animation: floatIcon 4s ease-in-out infinite;
        }

        @keyframes floatIcon {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .weather-desc-row {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: rgba(255, 255, 255, 0.75);
            font-weight: 300;
            text-transform: capitalize;
            margin-bottom: 20px;
            animation: slideUp 1s ease forwards;
        }

        .stats-row {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            animation: slideUp 1.1s ease forwards;
            margin-bottom: 24px;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 100px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
        }

        .stat-pill-ico {
            font-size: 0.95rem;
        }

        /* ── FORECAST STRIP ── */
        .forecast-strip {
            display: flex;
            gap: 10px;
            animation: slideUp 1.2s ease forwards;
        }

        .fc-pill {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            min-width: 70px;
        }

        .fc-pill:hover,
        .fc-pill.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .fc-pill-day {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .fc-pill-ico {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .fc-pill-hi {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .fc-pill-lo {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 2px;
        }

        .fc-pill-desc {
            font-size: 0.62rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            text-transform: capitalize;
        }

        /* ── RIGHT PANEL ── */
        .right-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: flex-end;
            padding-bottom: 10px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 16px;
            backdrop-filter: blur(16px);
            animation: slideLeft 0.8s ease forwards;
            opacity: 0;
        }

        .info-card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .info-card:nth-child(2) {
            animation-delay: 0.4s;
        }

        .info-card:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes slideLeft {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .card-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .clock-display {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            color: #fff;
            letter-spacing: 2px;
            line-height: 1;
        }

        .clock-date {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        /* SUN BAR */
        .sun-bar-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .sun-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .sun-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 4px;
            transition: width 1s ease;
        }

        .sun-time {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
        }

        /* WIND COMPASS */
        .compass-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .compass {
            width: 52px;
            height: 52px;
            position: relative;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .compass-needle {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, #ef4444 50%, rgba(255, 255, 255, 0.3) 50%);
            border-radius: 2px;
            transform-origin: center bottom;
            bottom: 50%;
            left: 50%;
            margin-left: -1px;
            transition: transform 1s ease;
        }

        .compass-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fff;
            z-index: 1;
        }

        .wind-info {
            flex: 1;
        }

        .wind-speed {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .wind-dir {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* FEELS / HUMIDITY GAUGES */
        .gauge-row {
            display: flex;
            gap: 10px;
        }

        .gauge {
            flex: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 8px;
        }

        .gauge-val {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .gauge-lbl {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── TV MODE ── */
        .tv-mode-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 100px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }

        .tv-mode-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* TV mode hides certain elements */
        body.tv-mode .topnav {
            padding: 24px 40px;
        }

        body.tv-mode .right-panel {
            width: 320px;
        }

        body.tv-mode .main-content {
            padding: 0 40px 32px;
            gap: 32px;
        }

        body.tv-mode .temp-big {
            font-size: clamp(7rem, 20vw, 16rem);
        }

        body.tv-mode .city-name {
            font-size: clamp(4rem, 10vw, 9rem);
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .empty-state.hidden {
            opacity: 0;
        }

        .empty-ico {
            font-size: 5rem;
            margin-bottom: 16px;
            opacity: 0.3;
            animation: floatIcon 3s ease-in-out infinite;
        }

        .empty-txt {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 300;
        }

        /* ── WEATHER CONTENT (hidden until loaded) ── */
        .weather-content {
            display: none;
        }

        .weather-content.show {
            display: flex;
        }

        /* ── ANIMATIONS ── */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* ── LOADING ── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .loading-overlay.show {
            display: flex;
        }

        .loader {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar {
            width: 0;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .right-panel {
                display: none;
            }

            .main-content {
                padding: 0 16px 16px;
            }

            .topnav {
                padding: 14px 16px;
            }

            .forecast-strip {
                gap: 6px;
            }

            .fc-pill {
                padding: 10px 6px;
            }
        }

        /* ── AD SLOTS ── */
        .ad-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding: 7px 0;
            min-height: 66px;
        }

        .ad-label {
            position: absolute;
            top: 2px;
            left: 8px;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.22);
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
            font-family: 'Inter', sans-serif;
        }

        .ad-side {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            width: 100%;
            position: relative;
        }

        /* hide footer ad in TV mode, remove bottom padding */
        body.tv-mode .ad-footer {
            display: none;
        }

        body.tv-mode .app {
            padding-bottom: 0;
        }

        /* push app content above footer ad */
        .app {
            padding-bottom: 66px;
        }
    </style>
</head>

<body>

    <!-- ANIMATED BACKGROUND -->
    <canvas id="bgCanvas"></canvas>
    <canvas id="particleCanvas"></canvas>
    <div class="vignette"></div>

    <!-- LOADING -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
    </div>

    <!-- EMPTY STATE -->
    <div class="empty-state" id="emptyState">
        <div class="empty-ico">🌍</div>
        <div class="empty-txt">Busque uma cidade para ver o clima</div>
    </div>

    <!-- APP -->
    <div class="app">

        <!-- TOP NAV -->
        <div class="topnav">
            <div class="logo">Atlas</div>
            <span class="nav-sep">|</span>

            <div class="search-wrap">
                <span class="search-ico">🔍</span>
                <input id="searchInput" class="search-input" type="text" placeholder="Buscar cidade..."
                    autocomplete="off" />
                <div class="suggestions" id="suggestions"></div>
            </div>

            <div class="nav-right">
                <button class="tv-mode-btn" onclick="toggleTV()" id="tvBtn">📺 Modo TV</button>
                <a href="globe.html" class="icon-btn" title="Globo 3D">🌐</a>
                <a href="currency.html" class="icon-btn" title="Moedas">💱</a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">

            <!-- LEFT: WEATHER -->
            <div class="weather-main">

                <!-- EMPTY placeholder -->
                <div id="weatherPlaceholder" style="flex:1"></div>

                <!-- WEATHER DATA -->
                <div id="weatherContent" class="weather-content"
                    style="flex-direction:column; justify-content:flex-end; flex:1">

                    <div class="location-line" id="locLine">📍 <span id="locText">—</span></div>
                    <div class="city-name" id="cityName">—</div>
                    <div class="country-name" id="countryName">—</div>

                    <div class="temp-row">
                        <div class="temp-big" id="tempBig">—</div>
                        <div class="temp-unit">°C</div>
                        <div class="weather-icon-big" id="weatherIconBig">—</div>
                    </div>

                    <div class="weather-desc-row" id="weatherDesc">—</div>

                    <div class="stats-row" id="statsRow"></div>

                    <div class="forecast-strip" id="forecastStrip"></div>

                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="right-panel" id="rightPanel" style="display:none">

                <!-- CLOCK -->
                <div class="info-card">
                    <div class="card-label">Hora Local</div>
                    <div class="clock-display" id="clockDisplay">--:--</div>
                    <div class="clock-date" id="clockDate">—</div>
                </div>

                <!-- SUN -->
                <div class="info-card" id="sunCard">
                    <div class="card-label">Sol</div>
                    <div style="display:flex;justify-content:space-between;margin-bottom:8px">
                        <span style="font-size:0.75rem;color:rgba(255,255,255,0.7)">🌅 <span
                                id="sunriseTime">—</span></span>
                        <span style="font-size:0.75rem;color:rgba(255,255,255,0.7)">🌇 <span
                                id="sunsetTime">—</span></span>
                    </div>
                    <div class="sun-bar-wrap">
                        <span style="font-size:0.8rem">☀️</span>
                        <div class="sun-bar">
                            <div class="sun-bar-fill" id="sunBarFill" style="width:0%"></div>
                        </div>
                        <span style="font-size:0.8rem">🌙</span>
                    </div>
                </div>

                <!-- WIND COMPASS -->
                <div class="info-card">
                    <div class="card-label">Vento</div>
                    <div class="compass-wrap">
                        <div class="compass">
                            <div class="compass-needle" id="compassNeedle"></div>
                            <div class="compass-dot"></div>
                        </div>
                        <div class="wind-info">
                            <div class="wind-speed" id="windSpeed">— km/h</div>
                            <div class="wind-dir" id="windDir">—</div>
                        </div>
                    </div>
                </div>

                <!-- GAUGES -->
                <div class="info-card">
                    <div class="card-label">Condições</div>
                    <div class="gauge-row">
                        <div class="gauge">
                            <div class="gauge-val" id="feelsLike">—</div>
                            <div class="gauge-lbl">Sensação</div>
                        </div>
                        <div class="gauge">
                            <div class="gauge-val" id="humidity">—</div>
                            <div class="gauge-lbl">Umidade</div>
                        </div>
                        <div class="gauge">
                            <div class="gauge-val" id="pressure">—</div>
                            <div class="gauge-lbl">Pressão</div>
                        </div>

    <!-- AD FOOTER 728x90 fixo no rodapé — ativar após aprovação AdSense -->
    <div class="ad-footer">
        <span class="ad-label">Publicidade</span>
        <!-- ins class="adsbygoogle"
             style="display:block"

    <!-- script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script -->

    <script>
        /* ══════════════════════════════════════════════════════════
           KEYS
        ══════════════════════════════════════════════════════════ */
        const OWM_KEY = 'f4549c9b4d1799e4b5a4ac45c876c951';

        /* ══════════════════════════════════════════════════════════
           WEATHER THEMES — background changes per condition
        ══════════════════════════════════════════════════════════ */
        const THEMES = {
            clear_day: { colors: ['#0a1628', '#1a3a6a', '#2563eb'], particles: 'stars' },
            clear_night: { colors: ['#020408', '#050d1a', '#0a1525'], particles: 'stars' },
            clouds: { colors: ['#1a1f2e', '#2d3548', '#4a5568'], particles: 'none' },
            rain: { colors: ['#0d1117', '#1a2332', '#1e3a5a'], particles: 'rain' },
            drizzle: { colors: ['#111827', '#1f2d3d', '#2d4159'], particles: 'rain' },
            thunder: { colors: ['#050810', '#0f1520', '#1a2035'], particles: 'lightning' },
            snow: { colors: ['#1a2535', '#2d3f55', '#3d546e'], particles: 'snow' },
            mist: { colors: ['#1a1f2a', '#252c3a', '#303848'], particles: 'none' },
            default: { colors: ['#0a0e1a', '#111827', '#1e2d45'], particles: 'none' },
        };

        function getTheme(weatherId, pod) {
            const n = pod === 'n';
            if (weatherId >= 200 && weatherId < 300) return THEMES.thunder;
            if (weatherId >= 300 && weatherId < 400) return THEMES.drizzle;
            if (weatherId >= 500 && weatherId < 600) return THEMES.rain;
            if (weatherId >= 600 && weatherId < 700) return THEMES.snow;
            if (weatherId >= 700 && weatherId < 800) return THEMES.mist;
            if (weatherId === 800) return n ? THEMES.clear_night : THEMES.clear_day;
            if (weatherId > 800) return THEMES.clouds;
            return THEMES.default;
        }

        /* ══════════════════════════════════════════════════════════
           BACKGROUND CANVAS
        ══════════════════════════════════════════════════════════ */
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let currentColors = ['#0a0e1a', '#111827', '#1e2d45'];
        let targetColors = [...currentColors];
        let lerpT = 1;

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return [r, g, b];
        }

        function lerpColor(a, b, t) {
            const ca = hexToRgb(a), cb = hexToRgb(b);
            return `rgb(${Math.round(ca[0] + (cb[0] - ca[0]) * t)},${Math.round(ca[1] + (cb[1] - ca[1]) * t)},${Math.round(ca[2] + (cb[2] - ca[2]) * t)})`;
        }

        function drawBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            lerpT = Math.min(1, lerpT + 0.008);

            const c0 = lerpColor(currentColors[0], targetColors[0], lerpT);
            const c1 = lerpColor(currentColors[1], targetColors[1], lerpT);
            const c2 = lerpColor(currentColors[2], targetColors[2], lerpT);

            const grad = bgCtx.createRadialGradient(
                bgCanvas.width * 0.3, bgCanvas.height * 0.3, 0,
                bgCanvas.width * 0.5, bgCanvas.height * 0.5, bgCanvas.width * 0.8
            );
            grad.addColorStop(0, c1);
            grad.addColorStop(0.5, c0);
            grad.addColorStop(1, c2);

            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

            if (lerpT >= 1) currentColors = [...targetColors];
        }

        function setTheme(theme) {
            targetColors = theme.colors;
            lerpT = 0;
            setParticles(theme.particles);
        }

        /* ══════════════════════════════════════════════════════════
           PARTICLE CANVAS
        ══════════════════════════════════════════════════════════ */
        const pCanvas = document.getElementById('particleCanvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        let particleMode = 'none';

        function resizeParticles() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
        }

        function setParticles(mode) {
            particleMode = mode;
            particles = [];
            const W = window.innerWidth, H = window.innerHeight;

            if (mode === 'stars') {
                for (let i = 0; i < 200; i++) {
                    particles.push({
                        x: Math.random() * W, y: Math.random() * H,
                        r: Math.random() * 1.5 + 0.3,
                        alpha: Math.random() * 0.7 + 0.3,
                        twinkle: Math.random() * Math.PI * 2,
                        speed: Math.random() * 0.02 + 0.005,
                    });
                }
            } else if (mode === 'rain') {
                for (let i = 0; i < 180; i++) {
                    particles.push({
                        x: Math.random() * W, y: Math.random() * H,
                        length: Math.random() * 18 + 8,
                        speed: Math.random() * 8 + 6,
                        alpha: Math.random() * 0.4 + 0.2,
                        width: Math.random() * 1 + 0.5,
                    });
                }
            } else if (mode === 'snow') {
                for (let i = 0; i < 120; i++) {
                    particles.push({
                        x: Math.random() * W, y: Math.random() * H,
                        r: Math.random() * 3 + 1,
                        speed: Math.random() * 1.5 + 0.5,
                        alpha: Math.random() * 0.6 + 0.3,
                        drift: Math.random() * 0.8 - 0.4,
                        wobble: Math.random() * Math.PI * 2,
                        wobbleSpeed: Math.random() * 0.03 + 0.01,
                    });
                }
            } else if (mode === 'lightning') {
                for (let i = 0; i < 60; i++) {
                    particles.push({
                        x: Math.random() * W, y: Math.random() * H,
                        r: Math.random() * 1 + 0.3,
                        alpha: Math.random() * 0.3 + 0.1,
                        twinkle: Math.random() * Math.PI * 2,
                        speed: Math.random() * 0.03 + 0.01,
                    });
                }
            }
        }

        let lightningTimer = 0;
        let lightningFlash = 0;

        function drawParticles() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
            const W = pCanvas.width, H = pCanvas.height;

            if (particleMode === 'stars') {
                for (const p of particles) {
                    p.twinkle += p.speed;
                    const a = p.alpha * (0.6 + 0.4 * Math.sin(p.twinkle));
                    pCtx.beginPath();
                    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    pCtx.fillStyle = `rgba(255,255,255,${a})`;
                    pCtx.fill();
                }
            } else if (particleMode === 'rain') {
                pCtx.strokeStyle = 'rgba(150,200,255,0.4)';
                for (const p of particles) {
                    p.y += p.speed;
                    p.x += 1.5;
                    if (p.y > H) { p.y = -20; p.x = Math.random() * W; }
                    pCtx.beginPath();
                    pCtx.moveTo(p.x, p.y);
                    pCtx.lineTo(p.x - 3, p.y - p.length);
                    pCtx.lineWidth = p.width;
                    pCtx.globalAlpha = p.alpha;
                    pCtx.stroke();
                }
                pCtx.globalAlpha = 1;
            } else if (particleMode === 'snow') {
                for (const p of particles) {
                    p.y += p.speed;
                    p.wobble += p.wobbleSpeed;
                    p.x += p.drift + Math.sin(p.wobble) * 0.5;
                    if (p.y > H) { p.y = -10; p.x = Math.random() * W; }
                    if (p.x > W + 10) p.x = -10;
                    if (p.x < -10) p.x = W + 10;
                    pCtx.beginPath();
                    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    pCtx.fillStyle = `rgba(220,240,255,${p.alpha})`;
                    pCtx.fill();
                }
            } else if (particleMode === 'lightning') {
                // background stars dim
                for (const p of particles) {
                    p.twinkle += p.speed;
                    pCtx.beginPath();
                    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    pCtx.fillStyle = `rgba(180,200,255,${p.alpha * Math.abs(Math.sin(p.twinkle))})`;
                    pCtx.fill();
                }
                // random lightning flash
                lightningTimer--;
                if (lightningTimer <= 0) {
                    lightningTimer = Math.random() * 120 + 60;
                    lightningFlash = 8;
                }
                if (lightningFlash > 0) {
                    pCtx.fillStyle = `rgba(200,220,255,${lightningFlash / 80})`;
                    pCtx.fillRect(0, 0, W, H);
                    drawLightningBolt(W, H);
                    lightningFlash--;
                }
            }
        }

        function drawLightningBolt(W, H) {
            const x = Math.random() * W * 0.6 + W * 0.2;
            pCtx.strokeStyle = 'rgba(200,230,255,0.8)';
            pCtx.lineWidth = 2;
            pCtx.beginPath();
            let cx = x, cy = 0;
            pCtx.moveTo(cx, cy);
            while (cy < H * 0.7) {
                cx += (Math.random() - 0.5) * 60;
                cy += Math.random() * 40 + 20;
                pCtx.lineTo(cx, cy);
            }
            pCtx.stroke();
        }

        /* ══════════════════════════════════════════════════════════
           CLOCK
        ══════════════════════════════════════════════════════════ */
        let localOffset = 0;

        function updateClock() {
            const localMs = Date.now() + localOffset * 1000 + new Date().getTimezoneOffset() * 60000;
            const d = new Date(localMs);
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            const el = document.getElementById('clockDisplay');
            if (el) el.textContent = `${h}:${m}`;

            const dateEl = document.getElementById('clockDate');
            if (dateEl) dateEl.textContent = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        setInterval(updateClock, 1000);

        /* ══════════════════════════════════════════════════════════
           HELPERS
        ══════════════════════════════════════════════════════════ */
        function weatherIcon(id, pod) {
            const n = pod === 'n';
            if (id >= 200 && id < 300) return '⛈️';
            if (id >= 300 && id < 400) return '🌦️';
            if (id >= 500 && id < 510) return '🌧️';
            if (id === 511) return '🌨️';
            if (id >= 520 && id < 600) return '🌧️';
            if (id >= 600 && id < 700) return '❄️';
            if (id >= 700 && id < 800) return '🌫️';
            if (id === 800) return n ? '🌙' : '☀️';
            if (id === 801) return n ? '🌙' : '🌤️';
            if (id === 802) return '⛅';
            if (id >= 803) return '☁️';
            return '🌡️';
        }

        function windDirStr(deg) {
            const d = ['Norte', 'Nordeste', 'Leste', 'Sudeste', 'Sul', 'Sudoeste', 'Oeste', 'Noroeste'];
            return d[Math.round((deg || 0) / 45) % 8];
        }

        function fmtLocalTime(ts, offset) {
            const ms = ts * 1000 + offset * 1000 + new Date().getTimezoneOffset() * 60000;
            return new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        /* ══════════════════════════════════════════════════════════
           SEARCH
        ══════════════════════════════════════════════════════════ */
        let searchTimer;
        const searchInput = document.getElementById('searchInput');
        const suggestionsEl = document.getElementById('suggestions');

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            const q = searchInput.value.trim();
            if (q.length < 2) { suggestionsEl.classList.remove('open'); return; }
            searchTimer = setTimeout(() => fetchSuggestions(q), 280);
        });

        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') doSearch();
            if (e.key === 'Escape') suggestionsEl.classList.remove('open');
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('.search-wrap')) suggestionsEl.classList.remove('open');
        });

        async function fetchSuggestions(q) {
            try {
                const data = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(q)}&limit=6&appid=${OWM_KEY}`).then(r => r.json());
                if (!data.length) { suggestionsEl.classList.remove('open'); return; }
                suggestionsEl.innerHTML = data.map((c, i) =>
                    `<div class="sug-item" data-i="${i}">
        <span>📍</span>
        <div>
          <div>${c.name}${c.state ? ', ' + c.state : ''}</div>
          <div class="sug-sub">${c.country}${c.state ? '' : ', ' + c.name}</div>
        </div>
      </div>`
                ).join('');
                suggestionsEl.classList.add('open');
                suggestionsEl.querySelectorAll('.sug-item').forEach((el, i) => {
                    el.addEventListener('click', () => {
                        searchInput.value = '';
                        suggestionsEl.classList.remove('open');
                        loadWeather(data[i].lat, data[i].lon, data[i].name, data[i].country);
                    });
                });
            } catch { }
        }

        async function doSearch() {
            const q = searchInput.value.trim();
            if (!q) return;
            suggestionsEl.classList.remove('open');
            try {
                const geo = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(q)}&limit=1&appid=${OWM_KEY}`).then(r => r.json());
                if (!geo.length) return;
                loadWeather(geo[0].lat, geo[0].lon, geo[0].name, geo[0].country);
                searchInput.value = '';
            } catch { }
        }

        /* ══════════════════════════════════════════════════════════
           LOAD WEATHER
        ══════════════════════════════════════════════════════════ */
        async function loadWeather(lat, lon, city, country) {
            document.getElementById('loadingOverlay').classList.add('show');
            try {
                const [cur, fore] = await Promise.all([
                    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=pt_br&appid=${OWM_KEY}`).then(r => r.json()),
                    fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&lang=pt_br&cnt=40&appid=${OWM_KEY}`).then(r => r.json()),
                ]);
                renderWeather(cur, fore, city, country);
            } catch (e) {
                console.error(e);
            }
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        /* ══════════════════════════════════════════════════════════
           RENDER WEATHER
        ══════════════════════════════════════════════════════════ */
        function renderWeather(cur, fore, city, country) {
            const pod = cur.weather[0].icon.slice(-1);
            const id = cur.weather[0].id;
            const ico = weatherIcon(id, pod);

            // theme
            setTheme(getTheme(id, pod));

            // offset
            localOffset = cur.timezone;
            updateClock();

            // main fields
            document.getElementById('locText').textContent = `${city}, ${country}`;
            document.getElementById('cityName').textContent = city;
            document.getElementById('countryName').textContent = country;
            document.getElementById('tempBig').textContent = Math.round(cur.main.temp);
            document.getElementById('weatherIconBig').textContent = ico;
            document.getElementById('weatherDesc').textContent = cur.weather[0].description;

            // stats pills
            const stats = [
                { ico: '💧', val: `${cur.main.humidity}%`, label: 'Umidade' },
                { ico: '🌬️', val: `${Math.round(cur.wind.speed * 3.6)} km/h`, label: 'Vento' },
                { ico: '👁️', val: `${cur.visibility ? (cur.visibility / 1000).toFixed(1) : '-'} km`, label: 'Visib.' },
                { ico: '🌡️', val: `${cur.main.pressure} hPa`, label: 'Pressão' },
                { ico: '🤔', val: `${Math.round(cur.main.feels_like)}°C`, label: 'Sensação' },
            ];
            document.getElementById('statsRow').innerHTML = stats.map(s =>
                `<div class="stat-pill"><span class="stat-pill-ico">${s.ico}</span>${s.val} <span style="color:rgba(255,255,255,0.4);font-size:0.72rem">${s.label}</span></div>`
            ).join('');

            // forecast
            const days = {};
            for (const item of fore.list) {
                const ms = item.dt * 1000 + localOffset * 1000 + new Date().getTimezoneOffset() * 60000;
                const key = new Date(ms).toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric' });
                if (!days[key]) days[key] = { temps: [], icons: [], descs: [], pods: [] };
                days[key].temps.push(item.main.temp);
                days[key].icons.push(item.weather[0].id);
                days[key].pods.push(item.weather[0].icon.slice(-1));
                days[key].descs.push(item.weather[0].description);
            }

            document.getElementById('forecastStrip').innerHTML = Object.entries(days).slice(0, 7).map(([day, d], idx) => {
                const hi = Math.round(Math.max(...d.temps));
                const lo = Math.round(Math.min(...d.temps));
                const mid = Math.floor(d.icons.length / 2);
                const ic = weatherIcon(d.icons[mid], d.pods[mid]);
                const dc = d.descs[mid];
                const [wd, dn] = day.split(' ');
                return `<div class="fc-pill${idx === 0 ? ' active' : ''}" onclick="selectDay(this)">
      <div class="fc-pill-day">${wd} ${dn || ''}</div>
      <div class="fc-pill-ico">${ic}</div>
      <div class="fc-pill-hi">${hi}°</div>
      <div class="fc-pill-lo">${lo}°</div>
      <div class="fc-pill-desc">${dc}</div>
    </div>`;
            }).join('');

            // right panel
            const sunrise = fmtLocalTime(cur.sys.sunrise, localOffset);
            const sunset = fmtLocalTime(cur.sys.sunset, localOffset);
            document.getElementById('sunriseTime').textContent = sunrise;
            document.getElementById('sunsetTime').textContent = sunset;

            const nowSecs = Date.now() / 1000;
            const dayLength = cur.sys.sunset - cur.sys.sunrise;
            const dayProg = Math.max(0, Math.min(1, (nowSecs - cur.sys.sunrise) / dayLength));
            document.getElementById('sunBarFill').style.width = `${dayProg * 100}%`;

            document.getElementById('windSpeed').textContent = `${Math.round(cur.wind.speed * 3.6)} km/h`;
            document.getElementById('windDir').textContent = windDirStr(cur.wind.deg);
            document.getElementById('compassNeedle').style.transform = `rotate(${(cur.wind.deg || 0) + 180}deg)`;

            document.getElementById('feelsLike').textContent = `${Math.round(cur.main.feels_like)}°`;
            document.getElementById('humidity').textContent = `${cur.main.humidity}%`;
            document.getElementById('pressure').textContent = `${cur.main.pressure}`;

            // show content
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('weatherContent').classList.add('show');
            document.getElementById('weatherPlaceholder').style.display = 'none';
            document.getElementById('rightPanel').style.display = 'flex';
        }

        function selectDay(el) {
            document.querySelectorAll('.fc-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
        }

        /* ══════════════════════════════════════════════════════════
           TV MODE
        ══════════════════════════════════════════════════════════ */
        let tvMode = false;
        function toggleTV() {
            tvMode = !tvMode;
            document.body.classList.toggle('tv-mode', tvMode);
            document.getElementById('tvBtn').textContent = tvMode ? '✕ Sair TV' : '📺 Modo TV';
            if (tvMode) {
                document.documentElement.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        }

        /* ══════════════════════════════════════════════════════════
           ANIMATION LOOP
        ══════════════════════════════════════════════════════════ */
        function loop() {
            requestAnimationFrame(loop);
            drawBg();
            drawParticles();
        }

        window.addEventListener('resize', () => {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            resizeParticles();
        });

        resizeParticles();
        setParticles('stars');
        loop();

        /* ══════════════════════════════════════════════════════════
           AUTO-LOAD: São Paulo as default
        ══════════════════════════════════════════════════════════ */
        loadWeather(-23.5505, -46.6333, 'São Paulo', 'BR');
    </script>
