<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Atlas — Mapa Mundial, Previsão do Tempo e Conversor de Moedas</title>
    <meta name="description"
        content="Explore o mapa mundial interativo Atlas. Clique em qualquer país para ver previsão do tempo em tempo real e converta moedas de todo o mundo com taxas atualizadas." />
    <meta name="keywords"
        content="mapa mundial, previsão do tempo, conversor de moedas, clima ao vivo, câmbio, atlas, temperatura hoje" />
    <meta name="author" content="Atlas" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://atlascw.com.br/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://atlascw.com.br/" />
    <meta property="og:title" content="Atlas — Mapa, Tempo e Moedas" />
    <meta property="og:description"
        content="Mapa mundial interativo com previsão do tempo e conversor de moedas em tempo real." />
    <meta property="og:image" content="https://atlascw.com.br/og.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atlas — Mapa, Tempo e Moedas" />
    <meta name="twitter:description" content="Mapa mundial interativo com clima e conversor de moedas." />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <style>
        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --surface2: #1a2235;
            --border: #1e2d45;
            --accent: #3b82f6;
            --accent2: #60a5fa;
            --text: #e2e8f0;
            --muted: #64748b;
            --success: #22c55e;
            --warn: #f59e0b;
            --danger: #ef4444;
            --panel-w: 360px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ── MAP ── */
        #map {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        .leaflet-container {
            background: #060d1a;
        }

        /* ── TOP BAR ── */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(10, 14, 26, 0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent2);
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
            white-space: nowrap;
        }

        .search-wrap {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            padding: 8px 14px 8px 36px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-wrap input:focus {
            border-color: var(--accent);
        }

        .search-wrap input::placeholder {
            color: var(--muted);
        }

        .search-wrap .ico {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-results {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: none;
            z-index: 200;
        }

        .search-results.open {
            display: block;
        }

        .search-result-item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background 0.15s;
        }

        .search-result-item:hover {
            background: var(--surface2);
        }

        .topbar-right {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .tab-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active,
        .tab-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* ── SIDE PANEL ── */
        .panel {
            position: fixed;
            top: 56px;
            right: 0;
            bottom: 0;
            width: var(--panel-w);
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(16px);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 50;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .panel.open {
            transform: translateX(0);
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text);
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .panel-body::-webkit-scrollbar {
            width: 4px;
        }

        .panel-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* ── WEATHER CARD ── */
        .weather-hero {
            background: linear-gradient(135deg, #0f2044 0%, #0a1628 100%);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        .weather-hero::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .w-location {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .w-city {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .w-country {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .w-main {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .w-icon {
            font-size: 3rem;
            line-height: 1;
        }

        .w-temp {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--text);
        }

        .w-desc {
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: capitalize;
            margin-top: 2px;
        }

        .w-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .w-stat {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .w-stat-label {
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .w-stat-value {
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* forecast */
        .forecast-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 16px 0 8px;
        }

        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .forecast-item {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fc-day {
            font-size: 0.8rem;
            font-weight: 500;
            width: 36px;
        }

        .fc-icon {
            font-size: 1.2rem;
        }

        .fc-desc {
            flex: 1;
            font-size: 0.78rem;
            color: var(--muted);
            text-transform: capitalize;
        }

        .fc-temps {
            font-size: 0.82rem;
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
        }

        .fc-lo {
            color: var(--muted);
            font-weight: 400;
        }

        /* currency */
        .currency-section {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .currency-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .currency-flag {
            font-size: 1.4rem;
        }

        .currency-name {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .currency-code {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .rate-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.82rem;
        }

        .rate-row:last-child {
            border-bottom: none;
        }

        .rate-label {
            color: var(--muted);
        }

        .rate-value {
            font-weight: 600;
        }

        /* ── CONVERTER ── */
        .converter {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
        }

        .converter h3 {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .conv-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .conv-input {
            flex: 1;
            padding: 9px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .conv-input:focus {
            border-color: var(--accent);
        }

        .conv-select {
            padding: 9px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            min-width: 80px;
        }

        .conv-arrow {
            text-align: center;
            color: var(--muted);
            font-size: 1rem;
            padding: 4px 0;
        }

        .conv-result {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 9px;
            padding: 12px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent2);
            min-height: 44px;
        }

        /* ── LOADING / EMPTY ── */
        .skeleton {
            background: linear-gradient(90deg, var(--surface2) 25%, var(--surface) 50%, var(--surface2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 8px;
            height: 16px;
            margin-bottom: 8px;
        }

        @keyframes shimmer {
            to {
                background-position: -200% 0;
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 20px;
            text-align: center;
            color: var(--muted);
        }

        .empty-state .ico {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 0.875rem;
            line-height: 1.6;
        }

        /* ── CONVERTER STANDALONE ── */
        .converter-panel {
            position: fixed;
            top: 56px;
            right: 0;
            bottom: 0;
            width: var(--panel-w);
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(16px);
            border-left: 1px solid var(--border);
            z-index: 50;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .converter-panel.open {
            transform: translateX(0);
        }

        /* ── MAP CLICK PULSE ── */
        .pulse-marker {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.8);
            border: 2px solid #fff;
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.6);
            animation: pulse 1.5s ease-out infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.6);
            }

            70% {
                box-shadow: 0 0 0 14px rgba(59, 130, 246, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            transition: transform 0.3s;
            z-index: 999;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ── MOBILE ── */
        @media (max-width: 600px) {
            :root {
                --panel-w: 100vw;
            }

            .logo {
                font-size: 1.1rem;
            }

            .tab-btn span {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- MAP -->
    <div id="map"></div>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="logo">🌍 Atlas</div>

        <div class="search-wrap">
            <span class="ico">🔍</span>
            <input id="searchInput" type="text" placeholder="Buscar cidade ou país..." autocomplete="off" />
            <div class="search-results" id="searchResults"></div>
        </div>

        <div class="topbar-right">
            <button class="tab-btn" id="btnWeather" onclick="openWeatherPanel()">🌤 <span>Tempo</span></button>
            <button class="tab-btn" id="btnConverter" onclick="toggleConverter()">💱 <span>Moedas</span></button>
        </div>
    </div>

    <!-- WEATHER PANEL -->
    <div class="panel" id="weatherPanel">
        <div class="panel-header">
            <span class="panel-title" id="panelTitle">Previsão do Tempo</span>
            <button class="close-btn" onclick="closePanel()">✕</button>
        </div>
        <div class="panel-body" id="panelBody">
            <div class="empty-state">
                <div class="ico">🗺️</div>
                <p>Clique em qualquer ponto do mapa para ver a previsão do tempo e informações de moeda local.</p>
            </div>
        </div>
    </div>

    <!-- CONVERTER PANEL -->
    <div class="converter-panel" id="converterPanel">
        <div class="panel-header">
            <span class="panel-title">💱 Conversor de Moedas</span>
            <button class="close-btn" onclick="closeConverter()">✕</button>
        </div>
        <div class="panel-body">
            <div class="converter" style="background:transparent;border:none;padding:0">
                <p style="font-size:0.8rem;color:var(--muted);margin-bottom:16px">Taxas atualizadas em tempo real</p>

                <div class="conv-row">
                    <input class="conv-input" type="number" id="convAmount" value="1" min="0" step="any" />
                    <select class="conv-select" id="convFrom"></select>
                </div>

                <div class="conv-arrow">⬇️</div>

                <div class="conv-row" style="margin-top:10px">
                    <select class="conv-select" id="convTo" style="flex:1"></select>
                </div>

                <div class="conv-result" id="convResult" style="margin-top:12px">—</div>

        width:100%; margin-top:10px; padding:10px;
        background:var(--surface); border:1px solid var(--border);
        border-radius:9px; color:var(--text); cursor:pointer; font-size:0.85rem;
        transition:background 0.2s;
      ">🔄 Inverter moedas</button>

                <div id="popularRates" style="margin-top:20px"></div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

        const CURRENCY_FLAGS = {
            BRL: '🇧🇷', USD: '🇺🇸', EUR: '🇪🇺', GBP: '🇬🇧', JPY: '🇯🇵', CNY: '🇨🇳', INR: '🇮🇳',
            CAD: '🇨🇦', AUD: '🇦🇺', CHF: '🇨🇭', MXN: '🇲🇽', RUB: '🇷🇺', ZAR: '🇿🇦', KRW: '🇰🇷',
            ARS: '🇦🇷', CLP: '🇨🇱', COP: '🇨🇴', TRY: '🇹🇷', SAR: '🇸🇦', AED: '🇦🇪', SGD: '🇸🇬',
            HKD: '🇭🇰', NZD: '🇳🇿', NOK: '🇳🇴', SEK: '🇸🇪', DKK: '🇩🇰', PLN: '🇵🇱', THB: '🇹🇭',
            IDR: '🇮🇩', MYR: '🇲🇾', PHP: '🇵🇭', VND: '🇻🇳', NGN: '🇳🇬', ILS: '🇮🇱', TWD: '🇹🇼',
        };

        /* ═══════════════════════════════════════════════════════════
           WEATHER ICONS (OWM id ranges)
        ═══════════════════════════════════════════════════════════ */
        function weatherIcon(id, pod) {
            const n = pod === 'n';
            if (id >= 200 && id < 300) return '⛈️';
            if (id >= 300 && id < 400) return '🌦️';
            if (id >= 500 && id < 510) return '🌧️';
            if (id === 511) return '🌨️';
            if (id >= 520 && id < 600) return '🌧️';
            if (id >= 600 && id < 700) return '❄️';
            if (id >= 700 && id < 800) return '🌫️';
            if (id === 800) return n ? '🌙' : '☀️';
            if (id === 801) return n ? '🌙' : '🌤️';
            if (id === 802) return '⛅';
            if (id >= 803) return '☁️';
            return '🌡️';
        }

        function fmtTemp(t) { return `${Math.round(t)}°C`; }

        function windDir(deg) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return dirs[Math.round(deg / 45) % 8];
        }

        /* ═══════════════════════════════════════════════════════════
           REVERSE GEOCODE  (nominatim)
        ═══════════════════════════════════════════════════════════ */
        async function reverseGeocode(lat, lon) {
            const r = await fetch(
                `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`,
                { headers: { 'Accept-Language': 'pt-BR,pt;q=0.9,en;q=0.8' } }
            );
            return r.json();
        }

        /* ═══════════════════════════════════════════════════════════
           WEATHER FETCH
        ═══════════════════════════════════════════════════════════ */
        async function fetchWeather(lat, lon) {
            const [cur, fore] = await Promise.all([
                fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=pt_br&appid=${OWM_KEY}`).then(r => r.json()),
                fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&lang=pt_br&cnt=40&appid=${OWM_KEY}`).then(r => r.json()),
            ]);
            return { cur, fore };
        }

        /* ═══════════════════════════════════════════════════════════
           EXCHANGE RATES
        ═══════════════════════════════════════════════════════════ */
        let ratesCache = {};
        let ratesBase = '';

        async function fetchRates(base = 'USD') {
            if (ratesBase === base && Object.keys(ratesCache).length > 0) return ratesCache;
            const r = await fetch(`https://v6.exchangerate-api.com/v6/${EXCHANGE_KEY}/latest/${base}`);
            const d = await r.json();
            if (d.result === 'success') {
                ratesCache = d.conversion_rates;
                ratesBase = base;
            }
            return ratesCache;
        }

        /* ═══════════════════════════════════════════════════════════
           PANEL STATE
        ═══════════════════════════════════════════════════════════ */
        let currentMarker = null;
        let currentCurrency = 'USD';

        function openWeatherPanel() {
            document.getElementById('weatherPanel').classList.add('open');
            document.getElementById('converterPanel').classList.remove('open');
            document.getElementById('btnWeather').classList.add('active');
            document.getElementById('btnConverter').classList.remove('active');
        }

        function closePanel() {
            document.getElementById('weatherPanel').classList.remove('open');
            document.getElementById('btnWeather').classList.remove('active');
        }

        function toggleConverter() {
            const p = document.getElementById('converterPanel');
            const open = p.classList.contains('open');
            if (open) {
                closeConverter();
            } else {
                p.classList.add('open');
                document.getElementById('weatherPanel').classList.remove('open');
                document.getElementById('btnConverter').classList.add('active');
                document.getElementById('btnWeather').classList.remove('active');
                initConverter();
            }
        }

        function closeConverter() {
            document.getElementById('converterPanel').classList.remove('open');
            document.getElementById('btnConverter').classList.remove('active');
        }

        /* ═══════════════════════════════════════════════════════════
           MAP CLICK
        ═══════════════════════════════════════════════════════════ */
        map.on('click', async (e) => {
            const { lat, lng } = e.latlng;

            // Remove old marker
            if (currentMarker) map.removeLayer(currentMarker);

            // Pulse marker
            const icon = L.divIcon({ className: '', html: '<div class="pulse-marker"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
            currentMarker = L.marker([lat, lng], { icon }).addTo(map);

            openWeatherPanel();
            showLoading();

            try {
                const [geo, { cur, fore }] = await Promise.all([
                    reverseGeocode(lat, lng),
                    fetchWeather(lat, lng),
                ]);

                const countryCode = geo?.address?.country_code?.toUpperCase() || '';
                const currency = COUNTRY_CURRENCY[countryCode] || 'USD';
                currentCurrency = currency;

                let rates = {};
                try { rates = await fetchRates(currency); } catch (e) { }

                renderWeatherPanel(cur, fore, geo, currency, rates);

            } catch (err) {
                document.getElementById('panelBody').innerHTML = `
        <div class="empty-state">
          <div class="ico">⚠️</div>
          <p>Não foi possível carregar os dados. Verifique sua conexão e tente novamente.</p>
        </div>`;
            }
        });

        /* ═══════════════════════════════════════════════════════════
           SHOW LOADING
        ═══════════════════════════════════════════════════════════ */
        function showLoading() {
            document.getElementById('panelBody').innerHTML = `
      <div style="padding:8px 0">
        <div class="skeleton" style="height:180px;margin-bottom:12px"></div>
        <div class="skeleton" style="width:60%"></div>
        <div class="skeleton" style="width:80%"></div>
        <div class="skeleton" style="width:50%"></div>
        <div class="skeleton" style="height:120px;margin-top:16px"></div>
      </div>`;
        }

        /* ═══════════════════════════════════════════════════════════
           RENDER WEATHER
        ═══════════════════════════════════════════════════════════ */
        function renderWeatherPanel(cur, fore, geo, currency, rates) {
            const city = cur.name || geo?.address?.city || geo?.address?.town || geo?.address?.county || '—';
            const country = cur.sys?.country || geo?.address?.country || '';
            const icon = weatherIcon(cur.weather[0].id, cur.weather[0].icon.slice(-1));
            const desc = cur.weather[0].description;
            const temp = fmtTemp(cur.main.temp);
            const feels = fmtTemp(cur.main.feels_like);
            const humid = cur.main.humidity;
            const wind = `${Math.round(cur.wind.speed * 3.6)} km/h ${windDir(cur.wind.deg || 0)}`;
            const vis = cur.visibility ? `${(cur.visibility / 1000).toFixed(1)} km` : '—';
            const pressure = `${cur.main.pressure} hPa`;

            // daily forecast from 3h data
            const days = {};
            for (const item of fore.list) {
                const d = new Date(item.dt * 1000);
                const key = d.toLocaleDateString('pt-BR', { weekday: 'short' });
                if (!days[key]) days[key] = { temps: [], icons: [], descs: [] };
                days[key].temps.push(item.main.temp);
                days[key].icons.push(weatherIcon(item.weather[0].id, 'd'));
                days[key].descs.push(item.weather[0].description);
            }

            const forecastHTML = Object.entries(days).slice(0, 5).map(([day, d]) => {
                const hi = Math.round(Math.max(...d.temps));
                const lo = Math.round(Math.min(...d.temps));
                const ic = d.icons[Math.floor(d.icons.length / 2)];
                const dc = d.descs[Math.floor(d.descs.length / 2)];
                return `<div class="forecast-item">
        <span class="fc-day">${day}</span>
        <span class="fc-icon">${ic}</span>
        <span class="fc-desc">${dc}</span>
        <span class="fc-temps">${hi}° <span class="fc-lo">/ ${lo}°</span></span>
      </div>`;
            }).join('');

            // currency rates
            let currencyHTML = '';
            const flag = CURRENCY_FLAGS[currency] || '🏳️';
            const name = CURRENCY_NAMES[currency] || currency;

            if (Object.keys(rates).length > 0) {
                const major = ['USD', 'EUR', 'BRL', 'GBP', 'JPY', 'CAD', 'AUD'].filter(c => c !== currency).slice(0, 6);
                const rateRows = major.map(c => {
                    const rate = rates[c];
                    if (!rate) return '';
                    return `<div class="rate-row">
          <span class="rate-label">${CURRENCY_FLAGS[c] || ''} ${c}</span>
          <span class="rate-value">${rate.toFixed(4)}</span>
        </div>`;
                }).join('');

                currencyHTML = `
        <div class="forecast-title">💰 Moeda local</div>
        <div class="currency-section">
          <div class="currency-header">
            <span class="currency-flag">${flag}</span>
            <div>
              <div class="currency-name">${name}</div>
              <div class="currency-code">1 ${currency} =</div>
            </div>
          </div>
          ${rateRows}
          <button onclick="openConverterWith('${currency}')" style="
            margin-top:12px; width:100%; padding:9px;
            background:var(--accent); border:none; border-radius:9px;
            color:#fff; font-size:0.83rem; font-weight:600; cursor:pointer;
          ">Abrir conversor →</button>
        </div>`;
            }

            document.getElementById('panelTitle').textContent = `${icon} ${city}`;
            document.getElementById('panelBody').innerHTML = `
      <div class="weather-hero">
        <div class="w-location">📍 ${city}, ${country}</div>
        <div class="w-main">
          <span class="w-icon">${icon}</span>
          <div>
            <div class="w-temp">${temp}</div>
            <div class="w-desc">${desc}</div>
          </div>
        </div>
        <div class="w-grid">
          <div class="w-stat"><div class="w-stat-label">Sensação</div><div class="w-stat-value">${feels}</div></div>
          <div class="w-stat"><div class="w-stat-label">Umidade</div><div class="w-stat-value">${humid}%</div></div>
          <div class="w-stat"><div class="w-stat-label">Vento</div><div class="w-stat-value">${wind}</div></div>
          <div class="w-stat"><div class="w-stat-label">Pressão</div><div class="w-stat-value">${pressure}</div></div>
        </div>
      </div>

      <div class="forecast-title">📅 Próximos dias</div>
      <div class="forecast-list">${forecastHTML}</div>

      ${currencyHTML}
    `;
        }

        /* ═══════════════════════════════════════════════════════════
           CONVERTER
        ═══════════════════════════════════════════════════════════ */
        const ALL_CURRENCIES = [
            'USD', 'EUR', 'BRL', 'GBP', 'JPY', 'CAD', 'AUD', 'CHF', 'CNY', 'HKD', 'NZD', 'SEK',
            'KRW', 'SGD', 'NOK', 'MXN', 'INR', 'RUB', 'ZAR', 'TRY', 'ARS', 'CLP', 'COP', 'PEN',
            'TWD', 'DKK', 'PLN', 'THB', 'IDR', 'MYR', 'PHP', 'VND', 'NGN', 'ILS', 'SAR', 'AED',
            'CZK', 'HUF', 'RON', 'UAH', 'BDT', 'PKR', 'QAR', 'KWD', 'BHD', 'OMR', 'EGP', 'MAD',
        ];

        function populateSelects() {
            const from = document.getElementById('convFrom');
            const to = document.getElementById('convTo');
            from.innerHTML = '';
            to.innerHTML = '';
            for (const c of ALL_CURRENCIES) {
                const f = CURRENCY_FLAGS[c] || '';
                from.innerHTML += `<option value="${c}">${f} ${c}</option>`;
                to.innerHTML += `<option value="${c}">${f} ${c}</option>`;
            }
            from.value = 'USD';
            to.value = 'BRL';
        }

        async function initConverter() {
            populateSelects();
            await convert();
            loadPopularRates();

            document.getElementById('convAmount').addEventListener('input', convert);
            document.getElementById('convFrom').addEventListener('change', async () => { ratesCache = {}; await convert(); loadPopularRates(); });
            document.getElementById('convTo').addEventListener('change', convert);
        }

        async function convert() {
            const amount = parseFloat(document.getElementById('convAmount').value) || 0;
            const from = document.getElementById('convFrom').value;
            const to = document.getElementById('convTo').value;
            const res = document.getElementById('convResult');
            res.textContent = '…';
            try {
                const rates = await fetchRates(from);
                const rate = rates[to];
                if (!rate) { res.textContent = '—'; return; }
                const result = (amount * rate).toLocaleString('pt-BR', { maximumFractionDigits: 4 });
                const rateStr = rate.toFixed(4);
                res.innerHTML = `<div style="font-size:1.3rem">${result} ${to}</div>
        <div style="font-size:0.72rem;color:var(--muted);margin-top:4px">1 ${from} = ${rateStr} ${to}</div>`;
            } catch {
                res.textContent = 'Erro ao buscar taxa';
            }
        }

        async function loadPopularRates() {
            const from = document.getElementById('convFrom').value;
            const rates = await fetchRates(from);
            const major = ['USD', 'EUR', 'BRL', 'GBP', 'JPY', 'CAD', 'AUD', 'CHF'].filter(c => c !== from).slice(0, 6);
            const html = major.map(c => {
                const r = rates[c];
                if (!r) return '';
                return `<div class="rate-row">
        <span class="rate-label">${CURRENCY_FLAGS[c] || ''} ${c} — ${CURRENCY_NAMES[c] || c}</span>
        <span class="rate-value">${r.toLocaleString('pt-BR', { maximumFractionDigits: 4 })}</span>
      </div>`;
            }).join('');
            document.getElementById('popularRates').innerHTML = `
      <div class="forecast-title" style="margin-top:0">Taxas populares (base: ${from})</div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:4px 12px">${html}</div>`;
        }

        function swapCurrencies() {
            const from = document.getElementById('convFrom');
            const to = document.getElementById('convTo');
            [from.value, to.value] = [to.value, from.value];
            ratesCache = {};
            convert();
            loadPopularRates();
        }

        function openConverterWith(currency) {
            document.getElementById('converterPanel').classList.add('open');
            document.getElementById('weatherPanel').classList.remove('open');
            document.getElementById('btnConverter').classList.add('active');
            document.getElementById('btnWeather').classList.remove('active');
            initConverter().then(() => {
                document.getElementById('convFrom').value = currency;
                ratesCache = {};
                convert();
                loadPopularRates();
            });
        }

        /* ═══════════════════════════════════════════════════════════
           SEARCH
        ═══════════════════════════════════════════════════════════ */
        let searchTimeout;

        document.getElementById('searchInput').addEventListener('input', function () {
            clearTimeout(searchTimeout);
            const q = this.value.trim();
            if (q.length < 3) { document.getElementById('searchResults').classList.remove('open'); return; }
            searchTimeout = setTimeout(() => doSearch(q), 350);
        });

        document.getElementById('searchInput').addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                this.value = '';
                document.getElementById('searchResults').classList.remove('open');
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrap')) {
                document.getElementById('searchResults').classList.remove('open');
            }
        });

        async function doSearch(q) {
            const r = await fetch(
                `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6`,
                { headers: { 'Accept-Language': 'pt-BR,pt;q=0.9' } }
            );
            const data = await r.json();
            const el = document.getElementById('searchResults');
            if (!data.length) { el.classList.remove('open'); return; }

            el.innerHTML = data.map((item, i) =>
                `<div class="search-result-item" data-i="${i}">${item.display_name}</div>`
            ).join('');
            el.classList.add('open');

            el.querySelectorAll('.search-result-item').forEach((div, i) => {
                div.addEventListener('click', () => {
                    const item = data[i];
                    const lat = parseFloat(item.lat);
                    const lon = parseFloat(item.lon);
                    map.flyTo([lat, lon], 8, { duration: 1.2 });
                    el.classList.remove('open');
                    document.getElementById('searchInput').value = '';
                    map.fire('click', { latlng: L.latLng(lat, lon) });
                });
            });
        }

        /* ═══════════════════════════════════════════════════════════
           TOAST
        ═══════════════════════════════════════════════════════════ */
        function showToast(msg, ms = 2500) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), ms);
        }

        /* ═══════════════════════════════════════════════════════════
           INIT HINT
        ═══════════════════════════════════════════════════════════ */
        setTimeout(() => showToast('🌍 Clique em qualquer lugar do mapa para ver o clima e a moeda local'), 1200);
    </script>
