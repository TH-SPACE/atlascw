<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — Clima e Moedas do Mundo</title>
    <meta name="description"
        content="Pesquise qualquer cidade e veja a previsão do tempo em tempo real, além de converter moedas de todo o mundo com taxas atualizadas." />
    <meta name="keywords" content="previsão do tempo, clima hoje, conversor de moedas, câmbio, temperatura, atlas" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://atlascw.com.br/" />
    <meta property="og:title" content="Atlas — Clima e Moedas do Mundo" />
    <meta property="og:description"
        content="Previsão do tempo e conversor de moedas em tempo real para qualquer lugar do mundo." />
    <meta property="og:url" content="https://atlascw.com.br/" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #07090f;
            --card: #0d1117;
            --card2: #111827;
            --border: rgba(255, 255, 255, 0.07);
            --accent: #3b82f6;
            --accent2: #60a5fa;
            --text: #f1f5f9;
            --muted: #64748b;
            --muted2: #94a3b8;
            --success: #22c55e;
            --warm: #f59e0b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── WORLD MAP SVG BACKGROUND ── */
        .map-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.04;
            pointer-events: none;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-bg svg {
            width: 100%;
            max-width: 1400px;
            height: auto;
        }

        /* ── GRID LINES ── */
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ── AMBIENT GLOWS ── */
        .glow1 {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
            top: -200px;
            left: -100px;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
        }

        .glow2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
        }

        /* ── LAYOUT ── */
        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        /* ── HEADER ── */
        header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .globe-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--muted2);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 5px 12px;
            border-radius: 100px;
            margin-bottom: 24px;
            transition: border-color 0.2s, color 0.2s;
        }

        .globe-link:hover {
            border-color: var(--accent);
            color: var(--accent2);
        }

        .logo {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: -3px;
            background: linear-gradient(135deg, #fff 0%, #93c5fd 60%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            margin-bottom: 12px;
        }

        .tagline {
            font-size: 1rem;
            color: var(--muted2);
            font-weight: 400;
            margin-bottom: 40px;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            gap: 6px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
            max-width: 360px;
            margin: 0 auto 36px;
        }

        .tab {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }

        /* ── SEARCH ── */
        .search-section {
            margin-bottom: 28px;
        }

        .search-box {
            position: relative;
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            padding: 14px 18px 14px 46px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .search-input::placeholder {
            color: var(--muted);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .search-btn {
            padding: 14px 22px;
            background: var(--accent);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 60px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            z-index: 100;
            display: none;
        }

        .suggestions.open {
            display: block;
        }

        .suggestion-item {
            padding: 11px 16px;
            cursor: pointer;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }

        .suggestion-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .suggestion-item .si-country {
            color: var(--muted);
            font-size: 0.78rem;
        }

        /* ── SECTIONS ── */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* ── WEATHER RESULT ── */
        .weather-result {
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .w-hero {
            background: linear-gradient(135deg, #0f1e3a 0%, #0a1220 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .w-hero::after {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .w-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .w-place-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .w-place-sub {
            font-size: 0.85rem;
            color: var(--muted2);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .w-datetime {
            text-align: right;
        }

        .w-time {
            font-size: 1.6rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .w-date {
            font-size: 0.78rem;
            color: var(--muted2);
        }

        .w-middle {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .w-emoji {
            font-size: 5rem;
            line-height: 1;
            filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.3));
        }

        .w-temp-big {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 1;
        }

        .w-feel {
            font-size: 0.82rem;
            color: var(--muted2);
            margin-top: 4px;
        }

        .w-desc {
            font-size: 1rem;
            color: var(--muted2);
            text-transform: capitalize;
            margin-top: 2px;
        }

        .w-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        @media (max-width: 560px) {
            .w-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .w-emoji {
                font-size: 3.5rem;
            }

            .w-temp-big {
                font-size: 3.5rem;
            }
        }

        .w-stat-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .w-stat-ico {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .w-stat-val {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .w-stat-lbl {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* forecast row */
        .forecast-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        @media (max-width: 560px) {
            .forecast-row {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .fc-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            transition: border-color 0.2s;
        }

        .fc-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }

        .fc-day {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .fc-ico {
            font-size: 1.6rem;
            margin-bottom: 6px;
        }

        .fc-hi {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .fc-lo {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .fc-desc {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 4px;
            text-transform: capitalize;
        }

        /* air quality / uv / sun */
        .extras-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (max-width: 480px) {
            .extras-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        .extra-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
        }

        .extra-title {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .extra-val {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .extra-sub {
            font-size: 0.75rem;
            color: var(--muted2);
            margin-top: 2px;
        }

        /* ── CURRENCY SECTION ── */
        .currency-result {
            animation: fadeUp 0.4s ease;
        }

        .conv-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
        }

        .conv-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .conv-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .conv-input {
            flex: 1;
            padding: 13px 16px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .conv-input:focus {
            border-color: var(--accent);
        }

        .conv-select {
            padding: 13px 12px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.875rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            min-width: 90px;
        }

        .conv-swap {
            width: 100%;
            padding: 12px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 10px;
            color: var(--accent2);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            margin: 4px 0 16px;
        }

        .conv-swap:hover {
            background: rgba(59, 130, 246, 0.15);
        }

        .conv-result-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(37, 99, 235, 0.06));
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
        }

        .conv-result-num {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--accent2);
        }

        .conv-result-rate {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 6px;
        }

        /* rates grid */
        .rates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        .rate-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s;
        }

        .rate-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .rate-flag {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .rate-code {
            font-size: 0.82rem;
            font-weight: 700;
        }

        .rate-name {
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .rate-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent2);
        }

        .rate-base {
            font-size: 0.68rem;
            color: var(--muted);
        }

        /* section title */
        .section-heading {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-heading::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── LOADING SKELETON ── */
        .skeleton {
            background: linear-gradient(90deg, var(--card2) 25%, rgba(255, 255, 255, 0.04) 50%, var(--card2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 10px;
        }

        @keyframes shimmer {
            to {
                background-position: -200% 0;
            }
        }

        /* ── EMPTY / INITIAL ── */
        .initial-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .initial-state .big-ico {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .initial-state p {
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* ── ERROR ── */
        .error-box {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 0.875rem;
            color: #fca5a5;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 32px 20px;
            color: var(--muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }

        footer a {
            color: var(--muted2);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--accent2);
        }
    </style>
</head>

        /* ═══════════════════════════════ HELPERS ═══════════════════════════ */
        function weatherIcon(id, pod = 'd') {
            const n = pod === 'n';
            if (id >= 200 && id < 300) return '⛈️';
            if (id >= 300 && id < 400) return '🌦️';
            if (id >= 500 && id < 510) return '🌧️';
            if (id === 511) return '🌨️';
            if (id >= 520 && id < 600) return '🌧️';
            if (id >= 600 && id < 700) return '❄️';
            if (id >= 700 && id < 800) return '🌫️';
            if (id === 800) return n ? '🌙' : '☀️';
            if (id === 801) return n ? '🌙' : '🌤️';
            if (id === 802) return '⛅';
            if (id >= 803) return '☁️';
            return '🌡️';
        }

        function windDir(deg) {
            const d = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'O', 'NO'];
            return d[Math.round((deg || 0) / 45) % 8];
        }

        function fmtTemp(t) { return `${Math.round(t)}°C`; }

        function getCurrencyByCode(code) {
            return CURRENCIES.find(c => c.code === code) || { code, name: code, flag: '🏳️' };
        }

        /* ═══════════════════════════════ TABS ══════════════════════════════ */
        let activeTab = 'weather';

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach((b, i) => {
                b.classList.toggle('active', (i === 0 && tab === 'weather') || (i === 1 && tab === 'currency'));
            });
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'currency' && !convInitialized) initConverter();
        }

        /* ═══════════════════════════════ WEATHER ════════════════════════════ */
        let weatherTimeout;

        const weatherInput = document.getElementById('weatherSearch');
        const suggestionsEl = document.getElementById('weatherSuggestions');

        weatherInput.addEventListener('input', () => {
            clearTimeout(weatherTimeout);
            const q = weatherInput.value.trim();
            if (q.length < 2) { suggestionsEl.classList.remove('open'); return; }
            weatherTimeout = setTimeout(() => fetchSuggestions(q), 300);
        });

        weatherInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') searchWeather();
            if (e.key === 'Escape') suggestionsEl.classList.remove('open');
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('.search-box')) suggestionsEl.classList.remove('open');
        });

        async function fetchSuggestions(q) {
            try {
                const r = await fetch(
                    `https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(q)}&limit=6&appid=${OWM_KEY}`
                );
                const data = await r.json();
                if (!data.length) { suggestionsEl.classList.remove('open'); return; }
                suggestionsEl.innerHTML = data.map((c, i) =>
                    `<div class="suggestion-item" data-i="${i}">
        <span>🔍</span>
        <div>
          <div>${c.name}${c.state ? ', ' + c.state : ''}</div>
          <span class="si-country">${c.country}</span>
        </div>
      </div>`
                ).join('');
                suggestionsEl.classList.add('open');
                suggestionsEl.querySelectorAll('.suggestion-item').forEach((el, i) => {
                    el.addEventListener('click', () => {
                        weatherInput.value = data[i].name + (data[i].state ? ', ' + data[i].state : '') + ', ' + data[i].country;
                        suggestionsEl.classList.remove('open');
                        loadWeather(data[i].lat, data[i].lon, data[i].name, data[i].country);
                    });
                });
            } catch { }
        }

        async function searchWeather() {
            const q = weatherInput.value.trim();
            if (!q) return;
            suggestionsEl.classList.remove('open');
            showWeatherLoading();
            try {
                const geo = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(q)}&limit=1&appid=${OWM_KEY}`).then(r => r.json());
                if (!geo.length) { showWeatherError('Cidade não encontrada. Tente outro nome.'); return; }
                await loadWeather(geo[0].lat, geo[0].lon, geo[0].name, geo[0].country);
            } catch {
                showWeatherError('Erro ao buscar dados. Verifique sua conexão.');
            }
        }

        async function loadWeather(lat, lon, city, country) {
            showWeatherLoading();
            try {
                const [cur, fore] = await Promise.all([
                    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=pt_br&appid=${OWM_KEY}`).then(r => r.json()),
                    fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&lang=pt_br&cnt=40&appid=${OWM_KEY}`).then(r => r.json()),
                ]);
                renderWeather(cur, fore, city || cur.name, country || cur.sys?.country);
            } catch {
                showWeatherError('Não foi possível carregar os dados do clima.');
            }
        }

        function showWeatherLoading() {
            document.getElementById('weatherResult').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="skeleton" style="height:260px;border-radius:20px"></div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
        ${Array(5).fill('<div class="skeleton" style="height:110px;border-radius:14px"></div>').join('')}
      </div>
    </div>`;
        }

        function showWeatherError(msg) {
            document.getElementById('weatherResult').innerHTML =
                `<div class="error-box">⚠️ ${msg}</div>`;
        }

        function renderWeather(cur, fore, city, country) {
            const icon = weatherIcon(cur.weather[0].id, cur.weather[0].icon.slice(-1));
            const temp = Math.round(cur.main.temp);
            const feels = Math.round(cur.main.feels_like);
            const desc = cur.weather[0].description;
            const humid = cur.main.humidity;
            const windSpd = Math.round(cur.wind.speed * 3.6);
            const windD = windDir(cur.wind.deg);
            const pressure = cur.main.pressure;
            const vis = cur.visibility ? (cur.visibility / 1000).toFixed(1) : '—';
            const clouds = cur.clouds?.all ?? '—';

            // local time
            const offset = cur.timezone;
            const localMs = Date.now() + offset * 1000 + new Date().getTimezoneOffset() * 60000;
            const localDt = new Date(localMs);
            const timeStr = localDt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            const dateStr = localDt.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

            // daily from 3h
            const days = {};
            for (const item of fore.list) {
                const d = new Date(item.dt * 1000 + offset * 1000 + new Date().getTimezoneOffset() * 60000);
                const key = d.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric' });
                if (!days[key]) days[key] = { temps: [], icons: [], descs: [] };
                days[key].temps.push(item.main.temp);
                days[key].icons.push(weatherIcon(item.weather[0].id, 'd'));
                days[key].descs.push(item.weather[0].description);
            }

            const forecastHTML = Object.entries(days).slice(0, 5).map(([day, d]) => {
                const hi = Math.round(Math.max(...d.temps));
                const lo = Math.round(Math.min(...d.temps));
                const ic = d.icons[Math.floor(d.icons.length / 2)];
                const dc = d.descs[Math.floor(d.descs.length / 2)];
                const [weekday, num] = day.split(' ');
                return `<div class="fc-card">
      <div class="fc-day">${weekday} ${num || ''}</div>
      <div class="fc-ico">${ic}</div>
      <div class="fc-hi">${hi}°</div>
      <div class="fc-lo">${lo}°</div>
      <div class="fc-desc">${dc}</div>
    </div>`;
            }).join('');

            // UV / sunrise / sunset extras
            const sunriseTs = cur.sys?.sunrise;
            const sunsetTs = cur.sys?.sunset;
            const sunrise = sunriseTs ? new Date((sunriseTs + offset + new Date().getTimezoneOffset() * 60) * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
            const sunset = sunsetTs ? new Date((sunsetTs + offset + new Date().getTimezoneOffset() * 60) * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';

            document.getElementById('weatherResult').innerHTML = `
    <div class="weather-result">
      <div class="w-hero">
        <div class="w-top">
          <div>
            <div class="w-place-name">${city}</div>
            <div class="w-place-sub">📍 ${country}</div>
          </div>
          <div class="w-datetime">
            <div class="w-time">${timeStr}</div>
            <div class="w-date">${dateStr}</div>
          </div>
        </div>
        <div class="w-middle">
          <div class="w-emoji">${icon}</div>
          <div>
            <div class="w-temp-big">${temp}°</div>
            <div class="w-desc">${desc}</div>
            <div class="w-feel">Sensação ${feels}°C</div>
          </div>
        </div>
        <div class="w-stats">
          <div class="w-stat-box"><div class="w-stat-ico">💧</div><div class="w-stat-val">${humid}%</div><div class="w-stat-lbl">Umidade</div></div>
          <div class="w-stat-box"><div class="w-stat-ico">🌬️</div><div class="w-stat-val">${windSpd} km/h</div><div class="w-stat-lbl">Vento ${windD}</div></div>
          <div class="w-stat-box"><div class="w-stat-ico">👁️</div><div class="w-stat-val">${vis} km</div><div class="w-stat-lbl">Visibilidade</div></div>
          <div class="w-stat-box"><div class="w-stat-ico">🌡️</div><div class="w-stat-val">${pressure} hPa</div><div class="w-stat-lbl">Pressão</div></div>
        </div>
      </div>

      <div class="section-heading">Próximos dias</div>
      <div class="forecast-row">${forecastHTML}</div>

      <div class="extras-row">
        <div class="extra-card"><div class="extra-title">☁️ Nebulosidade</div><div class="extra-val">${clouds}%</div><div class="extra-sub">cobertura</div></div>
        <div class="extra-card"><div class="extra-title">🌅 Nascer</div><div class="extra-val">${sunrise}</div><div class="extra-sub">hora local</div></div>
        <div class="extra-card"><div class="extra-title">🌇 Pôr do Sol</div><div class="extra-val">${sunset}</div><div class="extra-sub">hora local</div></div>
      </div>
    </div>`;
        }

        /* ═══════════════════════════════ CURRENCY ═══════════════════════════ */
        let convInitialized = false;
        let ratesCache = {};
        let ratesBase = '';

        async function initConverter() {
            convInitialized = true;
            const from = document.getElementById('convFrom');
            const to = document.getElementById('convTo');
            from.innerHTML = '';
            to.innerHTML = '';
            for (const c of CURRENCIES) {
                from.innerHTML += `<option value="${c.code}">${c.flag} ${c.code}</option>`;
                to.innerHTML += `<option value="${c.code}">${c.flag} ${c.code}</option>`;
            }
            from.value = 'USD';
            to.value = 'BRL';

            document.getElementById('convAmount').addEventListener('input', doConvert);
            from.addEventListener('change', () => { ratesCache = {}; doConvert(); loadRatesGrid(); });
            to.addEventListener('change', doConvert);

            await doConvert();
            await loadRatesGrid();
        }

        async function fetchRates(base) {
            if (ratesBase === base && Object.keys(ratesCache).length > 0) return ratesCache;
            const r = await fetch(`https://v6.exchangerate-api.com/v6/${EXCHANGE_KEY}/latest/${base}`);
            const d = await r.json();
            if (d.result === 'success') { ratesCache = d.conversion_rates; ratesBase = base; }
            return ratesCache;
        }

        async function doConvert() {
            const amount = parseFloat(document.getElementById('convAmount').value) || 0;
            const from = document.getElementById('convFrom').value;
            const to = document.getElementById('convTo').value;
            const numEl = document.getElementById('convResultNum');
            const rateEl = document.getElementById('convResultRate');
            const resIn = document.getElementById('convResultInput');
            numEl.textContent = '…';
            rateEl.textContent = '';
            try {
                const rates = await fetchRates(from);
                const rate = rates[to];
                if (!rate) return;
                const result = amount * rate;
                const fmt = result.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
                numEl.textContent = `${fmt} ${to}`;
                rateEl.textContent = `1 ${from} = ${rate.toFixed(4)} ${to}`;
                resIn.value = fmt;
            } catch { numEl.textContent = 'Erro'; }
        }

        async function swapCurrencies() {
            const from = document.getElementById('convFrom');
            const to = document.getElementById('convTo');
            [from.value, to.value] = [to.value, from.value];
            ratesCache = {};
            await doConvert();
            await loadRatesGrid();
        }

        async function loadRatesGrid() {
            const from = document.getElementById('convFrom').value;
            const rates = await fetchRates(from);
            const popular = ['USD', 'EUR', 'BRL', 'GBP', 'JPY', 'CAD', 'AUD', 'CHF', 'CNY', 'MXN', 'KRW', 'INR'].filter(c => c !== from).slice(0, 12);
            const grid = document.getElementById('ratesGrid');
            grid.innerHTML = popular.map(code => {
                const c = getCurrencyByCode(code);
                const val = rates[code];
                if (!val) return '';
                const fmt = val >= 1000
                    ? val.toLocaleString('pt-BR', { maximumFractionDigits: 2 })
                    : val.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
                return `<div class="rate-card" onclick="setConvTo('${code}')">
      <div class="rate-flag">${c.flag}</div>
      <div class="rate-code">${c.code}</div>
      <div class="rate-name">${c.name}</div>
      <div class="rate-value">${fmt}</div>
      <div class="rate-base">por 1 ${from}</div>
    </div>`;
            }).join('');
        }

        function setConvTo(code) {
            document.getElementById('convTo').value = code;
            doConvert();
        }
    </script>
</body>

</html>
