<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }

        .logo {
            font-size: clamp(4.5rem, 13vw, 10rem);
            font-weight: 900;
            letter-spacing: -6px;
            color: transparent;
            background: linear-gradient(135deg, #ffffff 0%, #a0c4ff 50%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            line-height: 1;
            text-transform: uppercase;
            filter: drop-shadow(0 0 40px rgba(80, 140, 255, 0.8)) drop-shadow(0 0 100px rgba(40, 80, 255, 0.4));
            animation: logoIn 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: scale(0.8);
        }

        @keyframes logoIn {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* trail canvas */
        #trail {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9;
        }

        /* scan line */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px);
            pointer-events: none;
            z-index: 20;
            mix-blend-mode: multiply;
        }

        /* vignette */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
            pointer-events: none;
            z-index: 8;
        }

        /* corner decorations */
        .corner {
            position: fixed;
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            animation: fadeCorner 2s 1s ease forwards;
        }

        .corner::before,
        .corner::after {
            content: '';
            position: absolute;
            background: rgba(80, 160, 255, 0.6);
        }

        .corner::before {
            width: 2px;
            height: 30px;
        }

        .corner::after {
            width: 30px;
            height: 2px;
        }

        .tl {
            top: 24px;
            left: 24px;
        }

        .tl::before {
            top: 0;
            left: 0;
        }

        .tl::after {
            top: 0;
            left: 0;
        }

        .tr {
            top: 24px;
            right: 24px;
        }

        .tr::before {
            top: 0;
            right: 0;
        }

        .tr::after {
            top: 0;
            right: 0;
        }

        .bl {
            bottom: 24px;
            left: 24px;
        }

        .bl::before {
            bottom: 0;
            left: 0;
        }

        .bl::after {
            bottom: 0;
            left: 0;
        }

        .br {
            bottom: 24px;
            right: 24px;
        }

        .br::before {
            bottom: 0;
            right: 0;
        }

        .br::after {
            bottom: 0;
            right: 0;
        }

        @keyframes fadeCorner {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <canvas id="c"></canvas>
    <canvas id="trail"></canvas>
    <div class="vignette"></div>
    <div class="scanline"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="ui">
        <div class="logo">Atlas</div>
    </div>

    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
    }
  }
  </script>

    <script type="module">
        import * as THREE from 'three';

        /* ─── RENDERER ────────────────────────────────────────── */
        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000510, 0.04);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 200);
        camera.position.set(0, 0, 3.6);

        /* ─── CUSTOM SHADERS ──────────────────────────────────── */

        // Atmosphere shader (rim glow)
        const atmoVS = `
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        vNormal  = normalize(normalMatrix * normal);
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        vViewDir = normalize(-mvPos.xyz);
        gl_Position = projectionMatrix * mvPos;
      }
    `;
        const atmoFS = `
      uniform vec3 glowColor;
      uniform float coeff;
      uniform float power;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      void main() {
        float intensity = pow(coeff - dot(vNormal, vViewDir), power);
        gl_FragColor = vec4(glowColor, intensity);
      }
    `;

        const atmoMat = new THREE.ShaderMaterial({
            uniforms: {
                glowColor: { value: new THREE.Color(0x2266ff) },
                coeff: { value: 0.8 },
                power: { value: 3.5 },
            },
            vertexShader: atmoVS,
            fragmentShader: atmoFS,
            side: THREE.FrontSide,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false,
        });

        // Outer halo
        const haloMat = new THREE.ShaderMaterial({
            uniforms: {
                glowColor: { value: new THREE.Color(0x0033cc) },
                coeff: { value: 0.6 },
                power: { value: 2.5 },
            },
            vertexShader: atmoVS,
            fragmentShader: atmoFS,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false,
        });

        /* ─── GLOBE ───────────────────────────────────────────── */
        const R = 1.0;
        const geoGlobe = new THREE.SphereGeometry(R, 128, 128);

        // Build vertex colors (fake continents via multi-octave sine)
        const pos = geoGlobe.attributes.position;
        const colArr = new Float32Array(pos.count * 3);
        const cLand = new THREE.Color(0x0d2d5c);
        const cOcean = new THREE.Color(0x040e1e);
        const cPolar = new THREE.Color(0x4488cc);

        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
            // multi-octave noise
            const n = Math.sin(x * 5.2 + 1.3) * Math.cos(y * 4.1 + 0.9) * Math.sin(z * 6.3 + 2.0)
                + Math.sin(x * 9.1 + y * 7.0) * 0.35
                + Math.cos(z * 8.5 + x * 3.2) * 0.2;
            // polar cap
            const lat = Math.abs(y);
            let c;
            if (lat > 0.88) c = cPolar;
            else if (n > 0.15) c = cLand;
            else c = cOcean;
            colArr[i * 3] = c.r;
            colArr[i * 3 + 1] = c.g;
            colArr[i * 3 + 2] = c.b;
        }
        geoGlobe.setAttribute('color', new THREE.BufferAttribute(colArr, 3));

        const matGlobe = new THREE.MeshPhongMaterial({
            vertexColors: true,
            specular: new THREE.Color(0x2244aa),
            shininess: 60,
        });

        const globe = new THREE.Mesh(geoGlobe, matGlobe);
        scene.add(globe);

        // Atmosphere shell
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(R * 1.07, 64, 64), atmoMat));
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(R * 1.22, 64, 64), haloMat));

        /* ─── GRID LINES ──────────────────────────────────────── */
        const lineMat = new THREE.LineBasicMaterial({
            color: 0x1a44aa, transparent: true, opacity: 0.3,
            blending: THREE.AdditiveBlending, depthWrite: false,
        });

        function latLine(phi) {
            const pts = [];
            const r = Math.sin(phi) * (R + 0.002);
            const yy = Math.cos(phi) * (R + 0.002);
            for (let j = 0; j <= 128; j++) {
                const a = (j / 128) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * r, yy, Math.sin(a) * r));
            }
            return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat);
        }
        function lonLine(theta) {
            const pts = [];
            for (let j = 0; j <= 128; j++) {
                const phi = (j / 128) * Math.PI;
                pts.push(new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * (R + 0.002),
                    Math.cos(phi) * (R + 0.002),
                    Math.sin(phi) * Math.sin(theta) * (R + 0.002),
                ));
            }
            return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat);
        }
        for (let i = 1; i < 10; i++) globe.add(latLine((i / 10) * Math.PI));
        for (let i = 0; i < 16; i++) globe.add(lonLine((i / 16) * Math.PI * 2));

        /* ─── SURFACE DOTS ────────────────────────────────────── */
        const dotPos = [];
        for (let i = 0; i < 3000; i++) {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;
            const r = R + 0.004;
            dotPos.push(
                Math.sin(phi) * Math.cos(theta) * r,
                Math.cos(phi) * r,
                Math.sin(phi) * Math.sin(theta) * r,
            );
        }
        const dotGeo = new THREE.BufferGeometry();
        dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPos, 3));
        const dotMat = new THREE.PointsMaterial({
            color: 0x4499ff, size: 0.007,
            transparent: true, opacity: 0.55,
            blending: THREE.AdditiveBlending, depthWrite: false,
        });
        globe.add(new THREE.Points(dotGeo, dotMat));

        /* ─── ARC CONNECTIONS ─────────────────────────────────── */
        function randomSurfacePoint() {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;
            return new THREE.Vector3(
                Math.sin(phi) * Math.cos(theta),
                Math.cos(phi),
                Math.sin(phi) * Math.sin(theta),
            );
        }

        function makeArc(a, b, segments = 60) {
            const pts = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const v = new THREE.Vector3().lerpVectors(a, b, t).normalize();
                const h = 1 + Math.sin(t * Math.PI) * 0.28;  // arc height
                pts.push(v.multiplyScalar(h));
            }
            return pts;
        }

        const arcs = [];
        const arcCount = 18;
        const arcMat = new THREE.LineBasicMaterial({
            color: 0x44aaff, transparent: true, opacity: 0,
            blending: THREE.AdditiveBlending, depthWrite: false,
        });

        for (let i = 0; i < arcCount; i++) {
            const a = randomSurfacePoint();
            const b = randomSurfacePoint();
            const pts = makeArc(a, b);
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = arcMat.clone();
            const line = new THREE.Line(geo, mat);
            globe.add(line);
            arcs.push({ line, mat, progress: 0, speed: 0.004 + Math.random() * 0.006, delay: Math.random() * 4 });
        }

        /* ─── ORBITING RINGS ──────────────────────────────────── */
        function makeRing(radius, tilt, color, opacity) {
            const pts = [];
            for (let i = 0; i <= 256; i++) {
                const a = (i / 256) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({
                color, transparent: true, opacity,
                blending: THREE.AdditiveBlending, depthWrite: false,
            });
            const ring = new THREE.Line(geo, mat);
            ring.rotation.x = tilt;
            scene.add(ring);
            return ring;
        }

        const ring1 = makeRing(1.55, Math.PI / 3, 0x2255ff, 0.35);
        const ring2 = makeRing(1.85, Math.PI / 6, 0x1133cc, 0.20);
        const ring3 = makeRing(2.10, Math.PI / 2.2, 0x0022aa, 0.15);

        /* ─── ORBITING PARTICLES ──────────────────────────────── */
        function makeOrbitDot(orbitRadius, tilt, color) {
            const geo = new THREE.SphereGeometry(0.018, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            // point light attached to the dot
            const light = new THREE.PointLight(color, 1.5, 0.6);
            mesh.add(light);
            scene.add(mesh);
            return { mesh, orbitRadius, tilt, angle: Math.random() * Math.PI * 2, speed: 0.006 + Math.random() * 0.004 };
        }

        const orbiters = [
            makeOrbitDot(1.55, Math.PI / 3, 0x55aaff),
            makeOrbitDot(1.55, Math.PI / 3, 0xaaddff),
            makeOrbitDot(1.85, Math.PI / 6, 0x3366ff),
            makeOrbitDot(2.10, Math.PI / 2.2, 0x2244cc),
        ];

        /* ─── STAR FIELD ──────────────────────────────────────── */
        const starPos = [];
        for (let i = 0; i < 5000; i++) {
            const r = 30 + Math.random() * 70;
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;
            starPos.push(
                Math.sin(phi) * Math.cos(theta) * r,
                Math.cos(phi) * r,
                Math.sin(phi) * Math.sin(theta) * r,
            );
        }
        const starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            color: 0xffffff, size: 0.06,
            transparent: true, opacity: 0.55,
            blending: THREE.AdditiveBlending, depthWrite: false,
        });
        scene.add(new THREE.Points(starGeo, starMat));

        /* ─── NEBULA (large soft glow clouds) ─────────────────── */
        function makeNebula(x, y, z, color, size) {
            const geo = new THREE.SphereGeometry(size, 8, 8);
            const mat = new THREE.MeshBasicMaterial({
                color, transparent: true, opacity: 0.04,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide,
            });
            const m = new THREE.Mesh(geo, mat);
            m.position.set(x, y, z);
            scene.add(m);
        }
        makeNebula(-8, 4, -15, 0x1122ff, 10);
        makeNebula(10, -3, -20, 0x002288, 14);
        makeNebula(2, 8, -18, 0x0011aa, 8);

        /* ─── LIGHTS ──────────────────────────────────────────── */
        const sunLight = new THREE.DirectionalLight(0x6699ff, 4);
        sunLight.position.set(-5, 3, 4);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x112244, 1.2);
        fillLight.position.set(5, -2, -3);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0x3355ff, 2.5);
        rimLight.position.set(3, 0, -5);
        scene.add(rimLight);

        scene.add(new THREE.AmbientLight(0x080818, 2));

        /* ─── MOUSE TRAIL (2D canvas) ─────────────────────────── */
        const trailCanvas = document.getElementById('trail');
        const ctx2d = trailCanvas.getContext('2d');
        trailCanvas.width = window.innerWidth;
        trailCanvas.height = window.innerHeight;

        const trail = [];
        const TRAIL_LEN = 80;
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let targetX = 0, targetY = 0;  // for globe rotation

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            targetX = (e.clientX / window.innerWidth - 0.5) * 2;
            targetY = (e.clientY / window.innerHeight - 0.5) * 2;
            trail.push({ x: mouseX, y: mouseY, age: 0 });
            if (trail.length > TRAIL_LEN) trail.shift();
        });

        // Click burst
        const bursts = [];
        window.addEventListener('click', e => {
            bursts.push({ x: e.clientX, y: e.clientY, r: 0, alpha: 1 });
        });

        function drawTrail() {
            ctx2d.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

            // trail
            for (let i = 1; i < trail.length; i++) {
                const t = i / trail.length;
                const prev = trail[i - 1];
                const curr = trail[i];
                ctx2d.beginPath();
                ctx2d.moveTo(prev.x, prev.y);
                ctx2d.lineTo(curr.x, curr.y);
                ctx2d.strokeStyle = `rgba(80,160,255,${t * 0.6})`;
                ctx2d.lineWidth = t * 2.5;
                ctx2d.lineCap = 'round';
                ctx2d.stroke();
            }

            // glow at cursor
            if (trail.length > 0) {
                const last = trail[trail.length - 1];
                const grad = ctx2d.createRadialGradient(last.x, last.y, 0, last.x, last.y, 28);
                grad.addColorStop(0, 'rgba(100,180,255,0.5)');
                grad.addColorStop(1, 'rgba(100,180,255,0)');
                ctx2d.beginPath();
                ctx2d.arc(last.x, last.y, 28, 0, Math.PI * 2);
                ctx2d.fillStyle = grad;
                ctx2d.fill();
            }

            // click bursts
            for (let i = bursts.length - 1; i >= 0; i--) {
                const b = bursts[i];
                ctx2d.beginPath();
                ctx2d.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx2d.strokeStyle = `rgba(100,180,255,${b.alpha})`;
                ctx2d.lineWidth = 2;
                ctx2d.stroke();
                b.r += 4;
                b.alpha -= 0.04;
                if (b.alpha <= 0) bursts.splice(i, 1);
            }
        }

        /* ─── RESIZE ──────────────────────────────────────────── */
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            trailCanvas.width = window.innerWidth;
            trailCanvas.height = window.innerHeight;
        });

        /* ─── ANIMATE ─────────────────────────────────────────── */
        const clock = new THREE.Clock();
        let rotX = 0, rotY = 0;

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            const dt = clock.getDelta ? 0.016 : 0.016;

            // globe rotation + mouse tilt
            rotX += (-targetY * 0.22 - rotX) * 0.05;
            rotY += (targetX * 0.22 - rotY) * 0.05;
            globe.rotation.y += 0.0018 + rotY * 0.001;
            globe.rotation.x = rotX;

            // rings drift
            ring1.rotation.z = t * 0.08;
            ring2.rotation.z = -t * 0.05;
            ring3.rotation.z = t * 0.04;

            // orbiters
            for (const o of orbiters) {
                o.angle += o.speed;
                const x = Math.cos(o.angle) * o.orbitRadius;
                const z = Math.sin(o.angle) * o.orbitRadius;
                const yy = Math.sin(o.angle * 0.5) * o.orbitRadius * Math.sin(o.tilt);
                o.mesh.position.set(x, yy, z);
            }

            // arcs animate along globe
            for (const a of arcs) {
                if (t < a.delay) continue;
                a.progress = Math.min(1, a.progress + a.speed);
                a.mat.opacity = a.progress < 0.5
                    ? a.progress * 0.9
                    : (1 - a.progress) * 0.9;
                if (a.progress >= 1) {
                    // reset
                    const p1 = randomSurfacePoint();
                    const p2 = randomSurfacePoint();
                    a.line.geometry.setFromPoints(makeArc(p1, p2));
                    a.progress = 0;
                    a.delay = t + Math.random() * 2;
                }
            }

            // atmosphere pulse
            atmoMat.uniforms.coeff.value = 0.78 + Math.sin(t * 1.3) * 0.04;

            // sun light slow orbit
            sunLight.position.x = Math.cos(t * 0.08) * 5;
            sunLight.position.z = Math.sin(t * 0.08) * 4;

            drawTrail();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>

</html>
