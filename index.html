<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* UI overlay */
        .ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }

        .logo {
            font-size: clamp(4rem, 12vw, 9rem);
            font-weight: 900;
            letter-spacing: -4px;
            color: #fff;
            line-height: 1;
            text-transform: uppercase;
            /* glassmorphism text shadow */
            text-shadow:
                0 0 80px rgba(100, 160, 255, 0.6),
                0 0 160px rgba(60, 120, 255, 0.3);
            animation: fadeIn 1.8s ease forwards;
            opacity: 0;
        }

        .tagline {
            margin-top: 1rem;
            font-size: clamp(0.7rem, 2vw, 1rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            animation: fadeIn 2.4s ease forwards;
            opacity: 0;
        }

        /* bottom glow line */
        .glow-line {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 160, 255, 0.6), transparent);
            animation: fadeIn 3s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* vignette */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.75) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>

<body>

    <canvas id="c"></canvas>
    <div class="vignette"></div>

    <div class="ui">
        <div class="logo">Atlas</div>
    </div>

    <div class="glow-line"></div>

    <!-- Three.js via CDN -->
    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
    }
  }
  </script>

    <script type="module">
        import * as THREE from 'three';

        /* ── SETUP ─────────────────────────────────────────────── */
        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 3.2);

        /* ── GLOBE ─────────────────────────────────────────────── */
        const RADIUS = 1;

        // base sphere — dark ocean
        const geoSphere = new THREE.SphereGeometry(RADIUS, 128, 128);
        const matSphere = new THREE.MeshPhongMaterial({
            color: 0x0a1628,
            specular: 0x224488,
            shininess: 40,
        });
        const globe = new THREE.Mesh(geoSphere, matSphere);
        scene.add(globe);

        // procedural "continents" via vertex color noise
        const posAttr = geoSphere.attributes.position;
        const colors = new Float32Array(posAttr.count * 3);
        const landColor = new THREE.Color(0x1a3a6a);
        const oceanColor = new THREE.Color(0x081020);

        // simple pseudo-noise using sine to fake continents
        for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i);
            const y = posAttr.getY(i);
            const z = posAttr.getZ(i);
            const n = Math.sin(x * 5.1 + 1.2) * Math.cos(y * 4.3 + 0.7) * Math.sin(z * 6.7 + 2.1)
                + Math.sin(x * 9.0 + y * 6.0) * 0.4;
            const c = n > 0.15 ? landColor : oceanColor;
            colors[i * 3] = c.r;
            colors[i * 3 + 1] = c.g;
            colors[i * 3 + 2] = c.b;
        }
        geoSphere.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        matSphere.vertexColors = true;

        // atmosphere glow shell
        const geoAtmo = new THREE.SphereGeometry(RADIUS * 1.06, 64, 64);
        const matAtmo = new THREE.MeshPhongMaterial({
            color: 0x3377ff,
            transparent: true,
            opacity: 0.08,
            side: THREE.FrontSide,
            depthWrite: false,
        });
        const atmo = new THREE.Mesh(geoAtmo, matAtmo);
        scene.add(atmo);

        // outer glow halo (backside)
        const geoHalo = new THREE.SphereGeometry(RADIUS * 1.18, 64, 64);
        const matHalo = new THREE.MeshPhongMaterial({
            color: 0x1155ff,
            transparent: true,
            opacity: 0.04,
            side: THREE.BackSide,
            depthWrite: false,
        });
        scene.add(new THREE.Mesh(geoHalo, matHalo));

        /* ── GRID LINES (lat/lon) ──────────────────────────────── */
        const gridMat = new THREE.LineBasicMaterial({
            color: 0x2255aa,
            transparent: true,
            opacity: 0.25,
        });

        function addCircle(radius, segments, axis) {
            const pts = [];
            for (let i = 0; i <= segments; i++) {
                const a = (i / segments) * Math.PI * 2;
                if (axis === 'y') pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
                if (axis === 'x') pts.push(new THREE.Vector3(0, Math.cos(a) * radius, Math.sin(a) * radius));
                if (axis === 'z') pts.push(new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const line = new THREE.Line(geo, gridMat);
            globe.add(line);
        }

        // latitudes
        const latCount = 8;
        for (let i = 1; i < latCount; i++) {
            const phi = (i / latCount) * Math.PI;
            const r = Math.sin(phi) * (RADIUS + 0.001);
            const y = Math.cos(phi) * (RADIUS + 0.001);
            const pts = [];
            for (let j = 0; j <= 128; j++) {
                const a = (j / 128) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            globe.add(new THREE.Line(geo, gridMat));
        }

        // longitudes
        for (let i = 0; i < 12; i++) {
            const theta = (i / 12) * Math.PI * 2;
            const pts = [];
            for (let j = 0; j <= 128; j++) {
                const phi = (j / 128) * Math.PI;
                pts.push(new THREE.Vector3(
                    Math.sin(phi) * Math.cos(theta) * (RADIUS + 0.001),
                    Math.cos(phi) * (RADIUS + 0.001),
                    Math.sin(phi) * Math.sin(theta) * (RADIUS + 0.001),
                ));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            globe.add(new THREE.Line(geo, gridMat));
        }

        /* ── DOTS on globe surface ─────────────────────────────── */
        const dotGeo = new THREE.BufferGeometry();
        const dotPositions = [];
        for (let i = 0; i < 2000; i++) {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;
            const r = RADIUS + 0.003;
            dotPositions.push(
                Math.sin(phi) * Math.cos(theta) * r,
                Math.cos(phi) * r,
                Math.sin(phi) * Math.sin(theta) * r,
            );
        }
        dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPositions, 3));
        const dotMat = new THREE.PointsMaterial({ color: 0x4488ff, size: 0.008, transparent: true, opacity: 0.6 });
        const dots = new THREE.Points(dotGeo, dotMat);
        globe.add(dots);

        /* ── PARTICLES (space) ────────────────────────────────── */
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for (let i = 0; i < 3000; i++) {
            starPos.push((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.012, transparent: true, opacity: 0.5 });
        scene.add(new THREE.Points(starGeo, starMat));

        /* ── LIGHTS ───────────────────────────────────────────── */
        // sun from the left
        const sun = new THREE.DirectionalLight(0x6699ff, 3.5);
        sun.position.set(-4, 2, 3);
        scene.add(sun);

        // subtle fill from the right
        const fill = new THREE.DirectionalLight(0x112244, 1.0);
        fill.position.set(4, -1, -2);
        scene.add(fill);

        // ambient
        scene.add(new THREE.AmbientLight(0x081828, 1.5));

        // rim light (back)
        const rim = new THREE.DirectionalLight(0x3366ff, 2.0);
        rim.position.set(2, 0, -4);
        scene.add(rim);

        /* ── MOUSE INTERACTION ────────────────────────────────── */
        const mouse = { x: 0, y: 0 };
        window.addEventListener('mousemove', e => {
            mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
            mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        /* ── RESIZE ───────────────────────────────────────────── */
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* ── ANIMATE ──────────────────────────────────────────── */
        const clock = new THREE.Clock();
        let targetRotX = 0, targetRotY = 0;

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // auto-rotate
            globe.rotation.y += 0.0012;
            globe.rotation.x += 0.0002;

            // mouse tilt (subtle)
            targetRotX += (-mouse.y * 0.18 - targetRotX) * 0.04;
            targetRotY += (mouse.x * 0.18 - targetRotY) * 0.04;
            globe.rotation.x = targetRotX + 0.0002 * t * 10;
            globe.rotation.y += 0.0012;

            // pulsing atmosphere
            matAtmo.opacity = 0.07 + Math.sin(t * 1.2) * 0.025;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>

</html>
